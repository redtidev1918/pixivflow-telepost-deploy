<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PixivFlow + TelePost Deploy 文档</title>
  <meta name="description" content="PixivFlow + TelePost Deploy 文档中心：部署、场景、运维与进阶。内容直接来自仓库里的 Markdown，与代码同步更新。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
  <link id="theme-css" rel="stylesheet" href="assets/vendor/vue.css">
  <script>
    (function () {
      var saved = localStorage.getItem('pk-theme');
      var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      if (dark) document.write('<link rel="stylesheet" href="assets/vendor/dark.css">');
    })();
  </script>
  <style>
    .theme-toggle {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 999;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid #cbd5e1;
      background: #fff;
      color: #334155;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    [data-theme="dark"] .theme-toggle {
      background: #1f2937;
      border-color: #475569;
      color: #fbbf24;
    }
  </style>
</head>
<body>
  <div id="app">加载中…</div>
  <button class="theme-toggle" id="theme-toggle" aria-label="切换明暗主题" title="切换明暗主题">🌙</button>
  <script>
    window.$docsify = {
      name: '🚀 PixivFlow + TelePost Deploy',
      nameLink: '#/',
      repo: 'redtidev1918/pixivflow-telepost-deploy',
            loadSidebar: true,
      // 语言是站点维度：docsify 原生按页面所在目录取 _sidebar.md——
      // 根页面读 /_sidebar.md，/en/ 页面读 /en/_sidebar.md；子目录页面会逐级向上
      // 回退到所属语言的侧边栏，无需为子目录配置 alias。
      // 注意：不要配置 '/.*/_sidebar.md' 之类的通配 alias，它会把 /en/_sidebar.md
      // 改写回根侧边栏，破坏分语言导航；页内标题也不注入 sidebar（无 subMaxLevel）。

      // 旧路径 → 新路径。文档信息架构在 2026-09 重组后，历史链接（README、CHANGELOG、
      // issue、外部文章）仍指向旧地址；这里保持它们可用。只做显式条目，不用通配。
      alias: {
        '/ARCHITECTURE.md': '/concepts/roles.md',
        '/SCENARIOS.md': '/platforms/docker.md',
        '/POLLING.md': '/platforms/docker.md',
        '/WEBHOOK.md': '/platforms/docker.md',
        '/MIHOMO.md': '/platforms/proxy.md',
        '/MULTI-BOT.md': '/operations/multi-bot.md',
        '/SCHEDULING.md': '/concepts/scheduling.md',
        '/PERFORMANCE.md': '/operations/performance.md',
        '/REMOTE_UPDATES.md': '/operations/upgrades.md',
        '/CREDENTIAL-HANDLING.md': '/concepts/credentials.md',
        '/en/SCENARIOS.md': '/en/platforms/docker.md',
        '/en/POLLING.md': '/en/platforms/docker.md',
        '/en/WEBHOOK.md': '/en/platforms/docker.md',
        '/en/MIHOMO.md': '/en/platforms/proxy.md'
      },

      auto2top: true,
      search: {
        placeholder: '搜索文档…',
        noData: '没有匹配的结果',
        paths: 'auto',
        depth: 3
      }
    };
  </script>
  <script src="assets/vendor/docsify.min.js"></script>
  <script src="assets/vendor/search.min.js"></script>
  <script>
    (function () {
      var btn = document.getElementById('theme-toggle');
      var css = document.getElementById('theme-css');
      var root = document.documentElement;
      function apply(dark) {
        root.setAttribute('data-theme', dark ? 'dark' : 'light');
        css.href = dark ? 'assets/vendor/dark.css' : 'assets/vendor/vue.css';
        btn.textContent = dark ? '☀️' : '🌙';
        localStorage.setItem('pk-theme', dark ? 'dark' : 'light');
      }
      var dark = localStorage.getItem('pk-theme') === 'dark';
      if (!localStorage.getItem('pk-theme')) {
        dark = matchMedia('(prefers-color-scheme: dark)').matches;
      }
      apply(dark);
      btn.addEventListener('click', function () {
        apply(root.getAttribute('data-theme') !== 'dark');
      });
    })();
  </script>
</body>
</html>
