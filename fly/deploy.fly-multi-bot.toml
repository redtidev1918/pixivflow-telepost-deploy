# TelePost 多 bot 实例（一台机承载 BOT1 + BOT2 两个频道）
# 模式：Webhook + 常驻一台（保证定时任务与投稿 bot 不被停机）
# 从仓库根目录部署：fly deploy -c fly/deploy.fly-multi-bot.toml --now
app = "your-app-name"
primary_region = "sin"

[build]
  # 直接 `fly deploy -c fly/<本文件>`：dockerfile 路径按本 toml 所在的 fly/ 目录
  # 解析，须用 ../docker/ 指回仓库根（写 docker/ 会报 fly/docker/... not found）。
  dockerfile = "../docker/combined.Dockerfile"

[build.args]
  TELEPOST_IMAGE = "ghcr.io/redtidev1918/telepost:2.17.1"
  PIXIVFLOW_VERSION = "2.16.1"

[env]
  PYTHONUNBUFFERED = "1"
  PYTHONDONTWRITEBYTECODE = "1"
  TZ = "Asia/Shanghai"
  RUN_MODE = "WEBHOOK"
  # 公网入口（run.py 会为每个 bot 生成 /webhook/botN 回调地址）
  WEBHOOK_URL = "https://your-app.fly.dev"
  # 双 bot 同机运行，simple 分词省内存；需要更高质量分词可改回 jieba
  SEARCH_ANALYZER = "simple"
  SEARCH_ENABLED = "false"
  DB_CACHE_KB = "1024"
  # 同一容器内启动 PixivFlow 单进程多计划调度器；不启动 WebUI
  PIXIVFLOW_ENABLED = "true"
  PIXIVFLOW_CONFIG = "/app/data/pixivflow/config.json"
  # PixivFlow 投递目标的基地址（合一台=同容器 127.0.0.1）
  TELEPOST_API_BASE_URL = "http://127.0.0.1:8080"
  PIXIV_DB_CACHE_KB = "4096"
  NODE_OPTIONS = "--max-old-space-size=96 --expose-gc"
  MALLOC_ARENA_MAX = "2"
  # 审核群多页预览：每批最多 10 张组成相册；1=后续批次回复上一批
  REVIEW_PREVIEW_THREAD = "1"
  REVIEW_PREVIEW_INTERVAL_SECONDS = "0.75"
  REVIEW_PREVIEW_TIMEOUT_SECONDS = "120"
  # 审核群相册每组媒体数（512MiB 小内存机器建议 4~5）
  REVIEW_ALBUM_SIZE = "5"
  # Bot API 只保证删除 48 小时内消息；1 天可可靠回收无人审核的群预览。
  PENDING_REVIEW_RETENTION_DAYS = "1"
  PENDING_REVIEW_CLEANUP_BATCH_SIZE = "20"
  REVIEW_RETENTION_DAYS = "30"
  # 多相册投稿跟随频道主贴进入已绑定的讨论组；两个 bot 可分别覆盖此值。
  CHANNEL_ALBUM_REPLY = "discussion"
  API_MAX_FILES = "100"

# 既有数据卷原样挂载（历史数据保留在卷上，新版写到 data/bot1、data/bot2 子目录）
[mounts]
  source = "data"
  destination = "/app/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false    # 常驻：投稿 bot 必须秒回，auto_stop 的唤醒延迟不可接受
  auto_start_machines = true
  min_machines_running = 1      # 至少一台常驻

  [[http_service.checks]]
    # /ready 聚合全部 bot 子进程就绪状态；冷启动子进程未完成 initialize+start
    # 时返回 503。批量投递高峰可能短暂变慢，超时放宽到 10s。
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    timeout = "10s"
    path = "/ready"

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512