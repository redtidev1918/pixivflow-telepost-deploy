# PixivFlow: the execution worker (its own app, its own machine, its own volume).
#
# One fixed machine with one fixed volume, on purpose. PixivFlow is a stateful
# durable worker: the slot ledger, the delivery outbox, the credential and the
# rate-limit state all live on that volume. "One machine per execution" would put
# the ledger on a filesystem that dies with the machine.
#
# Lifecycle is decided in three places, and all three are required:
#   1. Stopped by default. An idle worker should not be billed or hold memory.
#   2. Woken by the clock. The Cloudflare Worker POSTs an authenticated trigger to
#      this app; the Fly proxy starts the stopped machine and then forwards
#      (auto_start_machines = true). That is why there is no machine-management
#      API token or machine id anywhere in the trigger path.
#   3. Stops itself when the ledger is empty. schedulerRuntime.exitWhenIdle makes
#      the process exit once no slot is pending/running and no delivery is
#      outstanding. `restart policy = "never"` is the other half of this: with a
#      platform restart policy the machine would come straight back up and the
#      "stopped" state could never be reached.
#
# There is deliberately no http_service checks block. A probe that keeps hitting
# this app would fight the stopped state: Fly's proxy would wake a machine that
# just decided it had finished.
#
# Deploy (the app name comes from this file, so no -a):
#   fly deploy -c fly/deploy.pixivflow.toml --ha=false

app = 'pixivflow-scheduler'
primary_region = 'iad'
kill_signal = 'SIGTERM'
kill_timeout = 60

[build]
  dockerfile = '../docker/pixivflow-scheduler.Dockerfile'
  # Immutable by construction: a 40-char commit, never a branch name and never a
  # release tag. A branch name both defeats reproducibility and keeps the clone
  # layer cached forever, so the image keeps running old code while claiming to be
  # new. A tag is reproducible but NOT self-describing: the image's runtime ENV is
  # PIXIVFLOW_REVISION=${PIXIVFLOW_VERSION}+${PIXIVFLOW_REF}, i.e. it echoes the
  # build-arg LITERAL. Pinning `v2.19.0` made the machine report
  # `2.19.0+v2.19.0` (measured 2026-09-12), so "which commit is running?" became
  # unanswerable and scripts/verify-images.sh could only fail. A tag pin cannot be
  # rescued by resolving the tag in the verifier: the value has to be in the image.
  # scripts/verify-images.sh therefore rejects a non-commit PIXIVFLOW_REF outright.
  #
  # 9457726 = v2.19.5 (released 2026-09-13). Carries the candidate-scan fix: a slot
  # used to fetch exactly ONE candidate, so when that work was a duplicate the whole
  # job ended as success having submitted nothing. The fetch stage asked the ranking
  # API for `limit` works, the planner truncated the queue to the same number, and a
  # candidate that produced no submission was still counted as downloaded (a
  # duplicate resolves normally), which stopped the scan. `duplicate` was also a
  # terminal target outcome, so cell, slot and job all reported success. The scan is
  # now bounded by `download.candidateScanLimit` (default 5, per-target override,
  # PIXIV_CANDIDATE_SCAN_LIMIT, clamped 1..100) and drives the fetch stage too; a
  # candidate-level skip advances to the next candidate while a job-level outage
  # (Telegram/DB/Pixiv auth/network) still fails the job instead of masquerading as
  # "no eligible candidate". Concurrency reuses the existing slot lease, the
  # (slotId,targetId)->workId CAS and the delivery idempotency key.
  #
  # f331cd4 = v2.19.4 (released 2026-09-13). Carries the remote-failure semantics
  # fix: a delivery endpoint can answer HTTP 2xx while the record it persisted is
  # already terminally failed, and because that record is keyed by OUR idempotency
  # key a retry only returns the same broken record. Core used to parse such a
  # reused envelope as `idempotent_replay`, record the ledger `delivered` and
  # promote the Slot cell to `submitted` — a remote failure reported as end-to-end
  # success. A terminal downstream status (failed/rejected/invalid/expired) now
  # outranks the transport-level 2xx: the ledger records `failed` and the cell
  # settles `failed`, never `submitted`.
  #
  # 699f027 = v2.19.3 (released 2026-09-13). Carries the pager cursor fix. The
  # illustration and novel search pagers used to pass the cursor inside the search
  # options, which the kit ignores (it reads searchPage's SECOND POSITIONAL
  # argument), so the effective cursor stayed null and every iteration re-fetched
  # page 1. On a fallback day whose page 1 is entirely newer than endDate the walk
  # can neither include nor stop, so it never terminated: /v1/search/illust was
  # re-issued until the run burned the full 1800000ms schedule timeout under 429
  # pressure. The pager now advances the cursor, and a cursor that fails to advance
  # (the same next twice, or an A -> B -> A cycle) fails deterministically with
  # PaginationError instead of spinning.
  #
  # 4b69380 = v2.19.2 (released 2026-09-12). This is the first release that carries
  # all three fixes behind the frozen-production incident: the caller signal is now
  # combined with the per-request timeout, a Slot abandoned by its own timeout is
  # terminalised instead of staying recoverable (which is what made the recovery
  # sweep re-dispatch the same occurrence forever), and a notification producer can
  # no longer enqueue against a delivery target that has no notificationUrl.
  #
  # 065ad62 = v2.19.1 (released 2026-09-12), the first release that also carries
  # the Telegram credential-detection rules added after 2.19.0.
  #
  # 8938ca9 (master, 2026-09-13, PR #74) carries the schedule ADMISSION and TERMINAL
  # OUTCOME observability added after the 2026-09-13 missed morning occurrence:
  # every trigger arrival (before auth), refusal, rejection and terminal rollup now
  # leaves one structured line, and `schedule.outcome` records a slot's business
  # verdict once, from durable state. This commit is deployed together with the
  # occurrence move to 10:00/22:00 that it exists to make observable; the
  # 2026-09-19 decision later removed the 22:00/22:10 evening occurrences (once per day).
  [build.args]
    # cdaedd0 = v2.20.2 (released 2026-09-14). Converges manual refetch from
    # durable slot state: refetch-outcome notifications go to refetchOutcomeUrl
    # (2.20.0/2.20.1 dead-lettered every outcome on the missing notificationUrl),
    # noteTerminalRefetchCell reports retry-exhausted / abort / dead-letter
    # terminals, GET /internal/targets/:id/refetch/:requestId exposes the exact
    # manual cell for TelePost's watchdog, unresolved {{refetchRequestId}} is
    # refused before the HTTP request, and duplicate/failed cells are terminal.
    # 3783257 = v2.21.0 (released 2026-09-15). Resource-scoped execution
    # governance: one admission mechanism (FIFO, per-resource capacity) that
    # every Pixiv-consuming work item passes — schedule, candidate fallback,
    # manual refetch and manual normal/relaxed recovery — so bot1/bot2 sharing
    # one Pixiv account can no longer run four Pixiv jobs at once. Queue waiting
    # is unfinished work (never an execution failure) and prevents premature
    # idle shutdown. Also carries durable normalized terminal reasons on every
    # terminal cell and the manual recovery presets (normal / relaxed,
    # occurrence-scoped). Governance stays dormant until the resource identity
    # and capacity exist in the baked production config (see the comment there).
    # d7d2489 = v2.22.1 (released 2026-09-16). Settles deterministic/non-retryable
    # delivery ACKs in the FIRST drain round.
    # f664f8c = v2.23.0 (released 2026-09-17). Business outcome taxonomy
    # (no_candidate/duplicate_only are normal ends, never internal_error),
    # recovery request business-state mapping (recoverStatus returns
    # business_state + user message), observability structured logs/admin API,
    # and duplicate-only dead-end terminals (bot1 9/16 RCA end-to-end).
    # baec8d08 = v2.28.0 (released 2026-09-18). Rich-novel preview phase 3:
    # Publish novel.md + images to TelePress /publish/rich-novel and inject the
    # returned Telegraph URL as `novel_preview_url` on the TelePost submission;
    # failures are non-fatal and logged as NOVEL_PUBLISH_FAILED (stage telepress_publish).
    # 13e234a6 = v2.29.0 (released 2026-09-18). candidate supply observability:
    # CandidateSupplyReport funnel + empty-result reason projection + target-labeled
    # recovery buttons; schema adds candidate_report to the slot ledger (back-fill-safe).
    # a1734351 = v2.37.0 (released 2026-09-19). WebUI Control Center Phase 3:
    # Recovery retry actions (server proxy + single frontend retry button on
    # terminal failed/no_candidate/duplicate cells) + novel rich-text type drift
    # fix (pixiv-client dist.d.ts lags package source; local structural types).
    # 66e1379b = v2.38.0 (released 2026-09-19). Send novel metadata url+localPath
    # as rich-novel manifest so TelePress can rewrite Pixiv CDN sources to the
    # fixed-upstream media proxy; local images still shipped for fallback.
    # abeccf50 = v2.39.0 (released 2026-09-19). MediaAsset/Artifact/ResolvedWork
    # + MaterializationPolicy (eager default); rich-novel manifest carries assetId/sourceUrl.
    # 8d72f5f5 = v2.40.0 (released 2026-09-19). On-demand novel preview: manifest-only
    # MediaReference (no local inline image download); ZIP/archive still materializes.
    # 471ff53 = v2.41.0 (released 2026-09-19). Wire download.materializationPolicy from
    # config into DownloadManager so production.json's on-demand is actually honored, and
    # split-worker config moves to the volume copy (/app/data/production.json, watchConfig=true).
    # f30c74d = v2.42.0 (released 2026-09-20). Scheduler /health reports runtime version
    # and commit so release/deploy/runtime identity can be verified without shell access.
    # 09d5c687 = v2.43.1: fix(delivery) maps canonical MediaAsset to TelePost's
    # wire contract (asset_id/source_url) before the multipart send.
    # a97e350 = v2.45.1: WebUI recovery write path requires a same-host Origin
    # (http/https) and returns 403 SCHEDULER_RECOVERY_ORIGIN_REJECTED otherwise,
    # closing the CSRF/origin gap on the bearer-token recovery proxy.
    # 326b8c0 = v2.46.0 (a7e99c5): novel cover semantics — the webview coverUrl
    # is normalized (default placeholder → null) and emitted as a dedicated
    # pixiv:<id>:novelcover MediaAsset so TelePost can build 'cover root + TXT
    # reply' without positional guessing; inline art stays preview-only.
    # c5d2995 = v2.47.0 (2b617256): submission-path consistency. An httpMultipart
    # target that does not declare idempotency_key gets {{idempotencyKey}}
    # auto-filled (autoIdempotencyKey: false opts out), so an ACK lost in transit
    # converges at TelePost instead of publishing twice; the never-evaluated
    # `success` block is gone and the capability key list is now enforced (a
    # misspelled key such as supportsAlbum warns instead of being dropped);
    # `type: "telegram"` is deprecated and warns once; the Pixiv author travels
    # into every submission ({{author}}); config-validation failures answer a
    # stable CONFIG_VALIDATION_* code instead of CLI guidance text.
    # c43e4c3 = v3.0.0 (95ccabe). The major is the WebUI location refactor, which
    # is breaking: `GET /api/files/location` answers *where* a file is and the
    # runtime no longer spawns a file manager — "reveal" became a host capability
    # (the desktop shows it, a server copies the path, and the WebUI falls back
    # to the clipboard instead of erroring). Also carries the CLI output fix:
    # `delivery`/`gateway`/`outbox`/`runs` printed nothing at all because the
    # entry point discarded the CommandResult a command returns; they now declare
    # metadata.rendersResult and print it (--json prints the payload), and
    # `pixivflow delivery status <id>` / `delivery retry <id> --yes` accept the id
    # positionally. The no-auth security notice no longer covers the app.
    # 33362ac = v3.0.1 (released 2026-09-26). A failing stage is visible again:
    # BaseCommand.failure() carries the reason in both `message` and `error`; the
    # entry point prints it to stderr and logs {command, stage, reason, retryable,
    # error}; src/logger.ts serializes an Error as {name,message,stack,cause}
    # instead of `"error":{}` (which is how `reconcile` hid its failing stage);
    # commands that print richer text themselves declare metadata.printsOwnErrors
    # so the reason is not duplicated; `pixivflow diagnose-egress` is an accepted
    # alias of `pixivflow diagnose egress`. Rollback = the c43e4c3 line above.
    # a0e5f0b = v3.0.2 (released 2026-09-27). A failure's contract fields survive
    # the log line: src/logger.ts now keeps an Error's own enumerable fields, so
    # `code`/`statusCode`/`cause` (CONFIG_ERROR, AUTH_ERROR, …) reach the
    # structured line instead of only name/message/stack — the field Deploy
    # AGENTS.md §25 tells an operator to grep. The startup path moved to
    # src/cli/fatalError.ts, logs the error object with stage=application.startup
    # and prints a reason to stderr even for an unrecognised failure; the command
    # catch and the default scheduler/download failure path print the reason too.
    # Rollback = the 33362ac line above.
    # b01a93d = v3.0.3 (released 2026-09-27). Two delivery bugs are fixed
    # upstream: a Pixiv-generated design cover (the per-novel title template,
    # always 640x900) is no longer shipped as a novel's cover — PixivFlow probes
    # the header bytes and emits cover_url: null, fail-open so a failed probe
    # never drops a real cover; and a topic target now searches its own tag
    # before related tags (topicDiscovery.relatedTags = always |
    # when_seed_insufficient | never, default always = unchanged behaviour), so
    # a related tag such as 丸吞 can no longer be substituted for the seed tag
    # such as 西瓜肚. Rollback = the a0e5f0be line above.
    # 583a74c = v3.1.0 (released 2026-09-27). Two upstream capability slices:
    # (1) every resolved topic tag carries provenance (seed / cooccurrence /
    # autocomplete) and a weight, so `topic resolve` / `topic test` can explain
    # why a work was recalled, and a topic target can rank its own 原始 Tag first
    # (`topicDiscovery.seedTier: on`) or restrict which tag sources may be walked
    # (`topicDiscovery.tagRelations.{allowSources,allow,deny}`, deny wins);
    # (2) a novel cover is classified by content type (custom / pixiv_generated |
    # 640x900 / unknown) from its header bytes and delivery is gated by
    # `download.novelCover.unknown` (skip | keep), fail-open. Defaults keep the
    # pre-3.1.0 behaviour (relatedTags always, seedTier off, translated-name
    # matching off). Rollback = the b01a93d line above.
    # d2e9c9e = v3.4.1 (released 2026-09-27). Two field-acceptance fixes.
    # (1) A terminal refetch verdict shipped the raw upstream technical text
    # across the boundary: a live acceptance run put a 220-char multi-line nginx
    # 502 HTML page into TelePost's `failure_code` CODE column, and from there
    # into the Mini App state view and the doctor's 24h failure composition. The
    # producer now translates the outcome ONCE through its existing classifier
    # (`terminalReasonFor` -> `protocolErrorCodeForTerminalReason` /
    # `TERMINAL_REASON_MESSAGES`) and ships `reasonCode` (the closed protocol/v1
    # `$defs/Error.code` vocabulary) plus a short business message; the wire form
    # gains the additive `reason_code` field, which an older consumer ignores.
    # (2) A consumer cancel only wrote the ledger and never interrupted the
    # in-flight run, so cancelling a `@manual-` job left that schedule's
    # admission wedged (runNow stayed false) until a process restart, and the run
    # kept scanning to its own timeout. Cancel now reaches the running slot: the
    # download manager aborts the in-flight request and stops scheduling new
    # candidate attempts, and the slot lease is released owner-guarded, so the
    # later `finally` release is a no-op. Rollback = the 5d23117 line above.
    # 5d23117 = v3.4.0 (released 2026-09-27). Workflow Protocol v1.1: the generic
    # POST /jobs face can name its target again. v1 required the target to be
    # discovered from configuration, but production configures FOUR manual-eligible
    # targets (2 bots x illustration/novel) and one Pixiv account, so every real
    # TelePost request was rejected 409 ambiguous_target while the legacy route kept
    # working — the face was unusable for the only consumer that needed it.
    # Additive fix: `params.target_id` is a SELECTOR over `schedules[].targetIds`
    # (404 unknown_target, 409 ambiguous_target when unspecified and several are
    # eligible; it never overrides delivery wiring or plan identity), `params.query`
    # becomes optional so a selector-only job runs the target exactly as configured
    # (the pre-protocol refetch semantics), and GET /capabilities declares the
    # `target_selector` feature so consumers can negotiate it. Also fixes the deploy
    # harness's shim-equivalence probe (non-UUID requestId -> 400, and the shim's
    # string `error` read as an object). Rollback = the ed16abe line above.
    # ed16abe = v3.3.0 (released 2026-09-27). Land the PixivFlow side of the
    # Workflow Protocol v1 boundary (protocol/v1 in this deploy repo): the
    # executor exposes GET /capabilities (negotiates the protocol version and
    # the `candidate_search` job kind), POST /jobs (admit a manual refetch as a
    # durable slot job, idempotent by idempotency_key), GET /jobs?idempotency_key=
    # and GET /jobs/:id (opaque correlation; slotId is not a status input), POST
    # /jobs/:id/cancel, plus the events channel (event_callback via the existing
    # outbox/delivery_events, ack via job_event_cursors). Internal 'refetch' ->
    # candidate_search mapped at the facade; the old /internal/targets/:id/refetch
    # route remains as a compatible shim, so TelePost may roll back with
    # PIXIVFLOW_JOB_TRANSPORT=legacy. outcome_version bumped to 2 (no consumer).
    # Rollback = the c195b90 line above.
    # c195b90 = v3.2.0 (released 2026-09-27). Ships `examples/onebot-adapter/`:
    # a zero-dependency, runnable OneBot v11 delivery adapter — the "thin
    # conversion process" docs/GATEWAY.md §5.3 only described. Contract message
    # parts -> OneBot v11 segments (text from message.text once; `file` kinds go
    # through the two-step upload_group_file/upload_private_file plus a notice),
    # and OneBot `retcode` -> contract ACK word (0 -> accepted + platform
    # message_id; async/retcode 1 -> pending, never success; deterministic
    # request codes -> failed; unreachable/unknown/5xx/bad auth -> a bare HTTP
    # code with no status word, so a fixable config stays retryable instead of
    # dead-lettering). It implements no QQ protocol and no login/QR flow: the QQ
    # session stays in NapCat. `--selftest` runs the whole mapping with no QQ,
    # and `src/__tests__/delivery/onebot-adapter-e2e.test.ts` drives it with the
    # real delivery runtime against a fake OneBot API. No behaviour change for
    # any existing route: PixivFlow still ships no platform connector.
    # Rollback = the 583a74c line above.
    PIXIVFLOW_REF = 'd2e9c9e338bd0e24762ef678bf1fe296c7f7adb9'
    PIXIVFLOW_VERSION = '3.4.1'

[[mounts]]
  source = 'pixivflow_data'
  destination = '/app/data'

[env]
  # The config *file* is addressed absolutely on purpose and lives on the mounted
  # volume (runtime-editable). The versioned default baked into the image is
  # hydrated to /app/data/production.json by the entrypoint on first start.
  # schedulerRuntime.watchConfig=true means the running process hot-reloads this
  # file on edit, so operators can tune schedules/targets/delivery/download
  # without rebuilding the image.
  #
  # The storage paths *inside* that file stay relative (./pixivflow.db,
  # ./downloads) and resolve against the config's own directory (/app/data), so
  # they always land on the volume. PixivFlow's config loader "auto-fixes"
  # absolute paths that fall outside the config's own directory and rewrites the
  # file in place; the replacement is its default ./downloads, an EPHEMERAL path
  # next to the volume, so absolute storage roots are forbidden here.
  PIXIV_DOWNLOADER_CONFIG = '/app/data/production.json'
  PIXIV_DB_CACHE_KB = '4096'
  NODE_ENV = 'production'
  NODE_OPTIONS = '--max-old-space-size=384'
  TZ = 'Asia/Shanghai'
  # TelePost owns submission/review/publish. This is the only way PixivFlow can
  # reach it: Flycast private network, no Telegram token, no channel id.
  TELEPOST_API_BASE_URL = 'http://telesubmit-multi-bot.flycast'

[http_service]
  internal_port = 8090
  # The trigger carries a bearer token and answers immediately; TLS terminates at
  # the Fly proxy.
  force_https = true
  # Wake a stopped machine on an inbound trigger, and never let the platform
  # decide a run has finished: only PixivFlow's own ledger can say that.
  auto_start_machines = true
  auto_stop_machines = false
  min_machines_running = 0
  # No checks here. See the header.

[[restart]]
  # The process exiting is the intended end of a run. Restarting it would defeat
  # the whole lifecycle.
  #
  # "never" is the fly.toml spelling. The Machines API normalizes it to
  # restart.policy = "no" in the live Machine config; the two are the same thing,
  # but flyctl rejects "no" here ("invalid restart policy: no").
  policy = 'never'
