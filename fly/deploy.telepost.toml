# TelePost: the always-on submission / review / publish service.
#
# TelePost is the only thing that talks to Telegram. Users submit in private chat,
# reviewers approve or reject, and an approved work is published to the channel by
# this app - never by an execution machine.
#
# It must never sleep: a submission bot that is cold-starting looks broken to the
# user, and there is no cost model that makes a user-visible submit button wait
# for a machine to boot. The PixivFlow worker is where the "stopped by default"
# saving comes from; this service stays resident.
#
# Deploy (the app name comes from this file, so no -a):
#   fly deploy -c fly/deploy.telepost.toml --ha=false

app = 'telesubmit-multi-bot'
primary_region = 'iad'

[build]
  dockerfile = '../docker/telepost.Dockerfile'
  [build.args]
    # Pin the released TelePost image. Never `latest`: a floating reference makes
    # "the same config" produce different code on different days.
    #
    # 2.19.0 = 2.18.0 + the Telegram Mini App (submission + moderation UI) as a
    # presentation adapter over the canonical HTTP API: server-side initData
    # verification, RBAC, shared refetch application command, /me/submissions,
    # review mutations. Bot/API/refetch behavior is unchanged (additive).
    # Requires MINIAPP_ENABLED + MINIAPP_SESSION_SECRET to expose the session
    # endpoint; without them the Mini App surface stays closed (§152-§153).
    # (2.18.0 shipped the refetch state machine without the Mini App surface;
    # the Mini App backend landed in 2.19.0.)
    #
    # 2.20.0 added same-domain static hosting for the Mini App (webapp/dist
    # served at /app/ by the TelePost webhook server; router forwards /app/*);
    # 2.21.1 fixes Mini App API routing: webapp resolves its prefix from the
    # ?bot= launch param (menu button sets it), multi-bot works.
    # 2.20.2 fixed the static-host child-crash regression.
    # 2.20.1 fixed the Docker build that 2.20.0 image publish depended on.
    # 2.17.6 classifies media from the FINAL artifact instead of source
    # metadata; 2.21.1 keeps that behavior.
    # 2.23.0 appends a 点击投稿 channel footer link to confirmed channel
    # publishes (CHANNEL_FOOTER_LINK / CHANNEL_FOOTER_TEXT; previews stay
    # clean). Configured per bot below.
    # 2.23.1 = provenance-validated refetch replacement (commit-after-staging),
    # durable-slot watchdog reconciliation instead of a local-time stale fail,
    # and the Mini App launch-data fix: initData comes from the Telegram SDK
    # (retrieveRawInitData) with the WebApp bridge only as a compatibility
    # fallback, plus a real auth error taxonomy.
    # 2.24.0 = Mini App production hardening: logical 'My Submissions' (one
    # item per review chain, human-owned only, owner-safe detail), official
    # @uppy/react integration for attachments, bottom-nav layout that measures
    # the real Tabbar (no hard-coded safe-area offsets), and the identity
    # / provenance model (submitter_user_id, actor_kind/subject) with audited
    # legacy backfill tooling.
    # 2.27.1 = fix: plain submissions (empty review_chain_id) are their own
    # chain head, so reviewers can edit/publish fresh submissions (prev.
    # 2.27.0 falsely declared every new submission obsolete).
    # 2.27.0 = reviewer-edited publication (immutable original + editorial
    # revision chain, publish-by-revision) and submitter publication
    # notification (bound to publication success only, one durable idempotent
    # DM per publication; SUBMITTER_PUBLISH_NOTIFY=off|published|with_changes).
    # 2.27.2 = editorial update is PATCH semantics (partial saves accumulate
    # on the draft instead of silently reverting unmentioned fields).
    # 2.27.3 = publication presentation SSOT: the spoiler '点击查看' media
    # hint only appears when the publication really carries previewable
    # media (document-only never does), and 投稿人 comes only from explicit
    # submitter identity — API token aliases are never shown as the author
    # (internal review surfaces show 来源 instead).
    # 2.27.4 = refetch generation replacement hardening: a committed
    # replacement atomically supersedes the old generation and installs the
    # new chain head; superseded generations are terminal history that
    # refuses every moderation action (409 review_superseded) and never
    # emits a rejection notification; the replaced review card loses its
    # actions; failed/no-alternative refetch leaves the current review
    # untouched. Rejection DMs now also reach human Mini App submitters.
    # 2.31.1 (2026-09-16): per-bot MINIAPP_SUBMIT_CTA now propagates into the
    # child bot processes, so the deploy's BOT{n}_MINIAPP_SUBMIT_CTA=true
    # actually turns on the [✉️ 我要投稿] inline submission CTA (previously
    # the per-bot toggle never reached the child env and the old textual
    # "点击投稿" footer remained). Requires 2.30.0+ CTA + 2.31.0 preview.
    # 2.31.2 (2026-09-16): review-approval notifies once (durable path only);
    # TXT success DM shows [📖 在线阅读] when the Telegraph preview succeeded;
    # review/superseded cards never carry the public submission CTA (public
    # CTA belongs only to final Channel Publications); a confirmed channel
    # root is never deleted nor re-run when the linked-discussion overflow
    # fails. Depends on 2.31.1 telepost.
    # 2.31.3 (2026-09-16): submission ConversationHandler updates commit their
    # next state and stop later PTB groups, preventing duplicate catch-all and
    # legacy callback handling of the same Telegram update.
    # 2.31.4 (2026-09-16): channel publication footers now carry BOTH semantic
    # actions as caption text links — ✉️ TG 投稿 (?start=submit) always and
    # 📱 Mini App (?startapp=submit) when MINIAPP_SUBMIT_CTA is on (no more
    # single opaque inline button that opens the Mini App); TXT previews add a
    # distinct 📖 在线阅读 action; Mini App tag separator hint/placeholder UX
    # updated. Deploy config (BOT{n}_MINIAPP_SUBMIT_CTA=true) is unchanged.
    # 2.32.0 (2026-09-17): submission resubmit outcome model — verified
    # reject→resubmit lineage (review_chain_id / generation / supersedes),
    # pending resubmit is ignored idempotently, distinct user outcomes, and a
    # Mini App 重投 button (resubmit_available). Requires 2.32.0 telepost.
    # 2.35.0 (2026-09-18): admission policy by SOURCE TRUST — API service
    # submissions always enter review; Mini App is gated by the independent
    # MINIAPP_REVIEW_REQUIRED switch; chat_direct stays DIRECT_PUBLISH by
    # default. Requires 2.35.0 telepost.
    # 2.36.0 (2026-09-18): candidate supply observability UX — renders the
    # CandidateSupplyReport funnel and labels recovery buttons per target
    # (重试·插画 / 放宽·插画). Requires 2.36.0 telepost.
    # 2.37.0 (2026-09-18): renders CandidateSupplyReport.inventory as
    # 待发池：N 条（预计可用到 YYYY-MM-DD）on empty-result messages.
    # 2.38.0 (2026-09-18): preannouncement when 待发池 empty, independent
    # 26h schedule watchdog, and read-only GET /api/v1/schedule/status.
    # 2.39.0 (2026-09-18): public multi-bot /status page (aggregated schedule
    # status) + schedule observability docs; watchdog/preannouncement unchanged.
    # 2.39.1 (2026-09-18): schedule/status + watchdog use the LATEST terminal
    # notification's status instead of MAX(status); watchdog logs alerts.
    # 2.40.0 (2026-09-18): /status + /pin_status Telegram commands (渠道置顶区).
    # 2.40.1 (2026-09-18): manual recovery uses UUID requestId PixivFlow accepts
    # and surfaces real failure reason instead of generic error.
    # 2.41.0 (2026-09-19): refined native-chat submission UX (stepped prompts,
    # upload progress, document-filename preview, clear next-step notices).
    # 2.42.0 (2026-09-19): private-chat preview sends the REAL selected media
    # once (photos as album, then video/animation/audio/document), separate from
    # the Mini App local preview; edits refresh only the control message.
    # 2.45.2 (2026-09-19): Mini App navigation unified so reviewers/admins can
    # submit alongside review queue (fixes blank admin surface).
    # 2.49.0 (2026-09-19): delivery asset contract (Step 10) — /api/v1/submissions
    # accepts optional JSON media_assets {asset_id, kind, source_url, mime_type?},
    # persists per review_chain_id in media_asset_refs, and GET /api/v1/reviews/{id}
    # returns them. Backward compatible; local file_id path unchanged.
    # 2.50.0 (2026-09-19): Step 11 DeliveryPlanner foundation — TelePost decides
    # how to deliver review media; read-only GET /api/v1/reviews/{id}/delivery-plan
    # returns per-asset strategy (telegram_file_id / remote_url / mixed) without
    # changing publication behavior until an adapter commits to the plan.
    # 2.51.0 (2026-09-20): Step 12 TelegramMediaCache — media_asset_refs now
    # carries file_id/file_unique_id (no new table); sender captures
    # file_unique_id into progress_json; planner reuses cached file_id.
    # 2.52.0 (2026-09-20): Step 12/13 delivery chain — publish_from_file_ids
    # adopts DeliveryPlanner and records confirmed Telegram file_id/file_unique_id
    # back into media_asset_refs (mark_delivered_for_chain).
    # 2.53.0 (2026-09-20): reaction-based heat — subscribes
    # message_reaction_count, persists per-message reaction totals, recomputes
    # published_posts.reactions/heat_score.
    # 2.54.0 (2026-09-20): hide views/forwards from user-facing stats (Bot API
    # does not provide them) + Step 14 second-delivery file_id reuse test.
    # 2.54.1 (2026-09-20): sanitize note HTML at insert and preserve submitter
    # media order through delivery; preview now matches publication order.
    # 2.54.2 (2026-09-20): fix reaction-count callback arity and suppress
    # user-facing error replies from channel contexts.
    # 2.55.0 (2026-09-20): multipart submissions accept the same optional
    # media_assets Delivery Asset Contract as JSON submissions; review-path
    # assets persist to existing media_asset_refs.
    # 2.55.1 (2026-09-20): private chat and Mini App previews render the real
    # channel caption; command menu button restored; bulk soft-delete added.
    # 2.55.2 (2026-09-20): fixes the menu-button API argument after 2.55.1.
    # 2.55.3 (2026-09-20): command menu + Mini App keyboard coexistence, one-tap
    # ?start=miniapp fallback, and private preview link-preview suppression.
    # 2.55.4 (2026-09-20): restores the reply keyboard after /cancel and uses
    # the explicit LinkPreviewOptions API on both preview paths.
    # 2.56.0 (2026-09-21): Mini App becomes the private-chat menu button when
    # configured; slash commands remain available. Reaction webhook ingestion
    # logs and /health metrics separate “no reactions” from “update missing”.
    # 2.56.1 (2026-09-21): public router /health aggregates child
    # reaction_ingest_by_bot, making reaction pipeline visibility externally
    # observable.
    # 2.56.2 (2026-09-21): channel Mini App footers use the Main Mini App
    # ?startapp=miniapp deep link, avoiding a bot-chat redirect fallback.
    # 2.57.0 (2026-09-21): DeliveryPlanner can rewrite exact allowlisted remote
    # media hosts through the public fixed-upstream media proxy.
    # 2.57.1 (2026-09-21): review_chain_id anchors at insert time, so
    # media_asset_refs persist for fresh submissions without waiting for a
    # restart backfill (production E2E self-test finding).
    # 2.58.0 (2026-09-21): Batch 5 typed MediaAsset domain model
    # (telepost/domain/media.py + DeliveryVariant); wire/DB/publish behavior
    # unchanged (regression-only refactor, 978 tests).
    # 2.58.1 (2026-09-21): align trailing novel documents in mixed delivery
    # plans; a TXT file_id can no longer be sent as a photo.
    # 2.63.0 (2026-09-22): admin manager alerts expose the anonymous submitter
    # ID, and /ban_user + /ban_api provide manual moderation fallbacks.
    # 2.64.0 (2026-09-24): /hotweek (natural-week hot ranking), /schedule
    # (native admin automation: SQLite persistent, hot-reload, idempotent),
    # scoped bot command menus (user vs admin), /help reorganized.
    # 2.64.3 (2026-09-24): novel TXT stays in the delivery plan (fixes empty
    # delivery); oversized images try bounded JPEG compression before document.
    # 2.65.0 (2026-09-24): Mini App hot content entry (home previews, /hot,
    # /post detail, media proxy) sharing the Bot HotService; fixes a hot-page
    # offset that skipped the first page; MINIAPP_CONTENT_ENABLED flag.
    # 2.66.0 (2026-09-24): novel cover root + Pillow fallback card
    # (NOVEL_FALLBACK_CARD_ENABLED); inline illustrations stay preview-only;
    # delivery can never be emptied by preview filtering (#130 class).
    # 2.67.0 (2026-09-24): mixed photo/document publications keep every asset
    # in the post archive; multi-document captions ship as trailing text.
    # 2.68.0 (2026-09-27): the review group previews a novel's real cover in the
    # same shape the channel publishes it (cover photo first, TXT document
    # reply); the cover is a staging-only preview and never enters the review
    # record (media_json/documents_json unchanged).
    # 2.68.1 (2026-09-27): pressing 重抓 now rewrites the review card itself into
    # a 「重抓中」 shape (发布/拒绝/遮罩 hidden, 重抓 + 查看原链接 kept) instead of
    # leaving it looking untouched; the progress reminder fires at 2 minutes and
    # edits that same card with the elapsed wait, and every terminal outcome
    # (replacement / no_alternative / failed / stalled / source resolved)
    # restores the actionable card. The source review is never pre-rejected —
    # that would obsolete its own replacement. Rollback = the 2.68.0 line above
    # (release commit 4653a80).
    # 2.69.0 (2026-09-27): the refetch job gets a canonical, durable lifecycle.
    # The attempt state machine (REQUESTED/SEARCHING/FILTERING/CANDIDATE_FOUND →
    # REPLACED | FAILED | TIMEOUT | NO_CANDIDATE | CANCELLED) has one authority and
    # one write path, a per-attempt timeline (`refetch_events`) and candidate
    # history; the review card shows 任务ID + stage + elapsed wait and repeats the
    # progress reminder every 2 minutes; a stalled stage times out at 10 minutes,
    # an unaccepted request at 20, the absolute ceiling at 30 — never an endless
    # 「仍在处理中」. Also ships `python -m telepost.observability.cli doctor`, a
    # read-only self-check (db integrity, stuck refetch, orphan reviews, stuck
    # publishing, delivery outbox, recent audit; exit 0/1/2, never writes).
    # Rollback = the 2.68.1 line above (release commit fa9323d's predecessor).
    # 2.70.0 (2026-09-27): the Mini App's 审核详情 page renders the same job
    # projection as the review card — 任务ID, the current stage and the elapsed
    # wait — and keeps 重抓 disabled for every canonical active state (the check
    # previously only knew the legacy vocabulary). The bundle ships inside this
    # image (Dockerfile builds webapp/dist). Rollback = the 2.69.0 line above.
    # 2.70.1 (2026-09-27): doctor no longer reports settled `delivery_ledger`
    # history as an anomaly — the ledger records CONFIRMED posts, so its oldest
    # row only ever grows; the age check now looks only at rows that never
    # reached a terminal success (partial/uncertain/failed/error). Rollback = 2.70.0.
    # 2.71.0 (2026-09-27): refetch runs over the Workflow Protocol v1 Job API —
    # a durable Job (heartbeat, backoff, restart recovery) whose terminality the
    # state machine tracks from the remote status, accelerated by the events
    # channel (POST /api/botN/v1/jobs/events ingress + reconcile loop, idempotent
    # by event_id, exactly-once terminal notification); callback_url is only sent
    # when TELEPOST_API_BASE_URL is set. Requires PixivFlow >= 3.4.0 on the
    # protocol transport: 3.3.0's generic face cannot express this deployment's
    # targets (see the PIXIVFLOW_JOB_TRANSPORT note below). Rollback = 2.70.1
    # (with PIXIVFLOW_JOB_TRANSPORT=legacy for the executor call path).
    # 2.71.1 (2026-09-27): a refetch terminal notification can no longer be
    # missed. A verdict delivered straight from the executor
    # (POST /api/v1/refetch/outcomes) bypassed the one-shot terminal seam, so it
    # could neither notify nor claim `terminal_notified_at` — the same task could
    # then be re-notified, or silently never notify. All four terminal sources
    # (poll, event callback, restart recovery, direct outcome callback) now pass
    # through one seam that claims the clock exactly once and always appends 任务ID;
    # an already-terminal replay notifies nobody. Alongside it the executor's
    # reason is normalized at the single write path: the CODE column keeps only
    # the closed protocol/v1 vocabulary (`remote_failure` fallback) and the
    # free-text column is bounded, single-line and markup-free, so a raw upstream
    # HTML error page can no longer reach the review card, the Mini App state view
    # or the doctor's failure composition. Additive wire field (`reason_code`);
    # best with PixivFlow >= 3.4.1, and an older producer degrades cleanly to
    # `remote_failure`. Rollback = 2.71.0.
    # 2.71.2 (2026-09-28): two review-queue safety fixes. (1) "清理测试数据" can no
    # longer delete real reviews: every row now carries an explicit data-class
    # marker ('real' default / 'test'), the purge deletes ONLY rows marked test,
    # and it refuses any chain that still carries a real row — the previous
    # username-pattern cleanup is exactly what deleted the real review #140 on
    # 2026-09-28. (2) Identity inheritance across a refetch replacement respects
    # that boundary: when a test-typed source chain delivers a real candidate, the
    # candidate keeps its own submitter identity and data class instead of
    # inheriting the fixture's username/user_id. Alongside them the review-group
    # preview arrives unmasked (submitter spoiler is not inherited into previews):
    # `spoiler` is a publication decision the reviewer takes on the card; since
    # 2.71.4 the reviewer's 「遮罩」 toggle re-edits the already-sent preview messages
    # (editMessageMedia has_spoiler) so the group image is masked/unmasked live.
    # Since 2.71.5, if that keyboard refresh fails after the mask is applied, the
    # reviewer gets a visible show_alert popup (with the actual mask state) instead
    # of a stale button label with no notice. Best with PixivFlow >= 3.4.2 (a failed
    # cover probe now defaults to skipping the cover). Rollback = 2.71.4.
    # 2.72.0 (2026-09-30): three delivery/review fixes. (1) oversized manga pages
    # are resized into publishable photos instead of being dropped. (2) kept
    # content-duplicate original-image documents are labeled「原图」in delivery and
    # on the review card. (3) the review-card file-count text is formatted and
    # explicit (e.g. "N 个文档（含 M 份原图）"). Decode memory budget is now capacity
    # aware and fully env-configurable (no hardcoded literals). Rollback = 2.71.5.
    # 2.73.0 (2026-09-30): new reviewer endpoint POST /api/v1/reviews/{id}/rerender
    # re-stages a stored card's media/documents through the full pipeline as a new
    # pending review, so an old-format card can be re-rendered under the current
    # code (e.g. the「N 个文档（含 M 份原图）」line; original-image documents keep
    # their「原图」 flag). Re-render is refused for published/approved/publishing
    # chains and keeps the new card pending. Rollback = 2.72.0.
    # 2.73.3 (2026-09-30): conditional original preservation. Original-image
    # documents are attached only when at least one image in the album must be
    # transformed (compressed / previewed / document fallback); if EVERY image is
    # within Telegram limits the album ships as photos only, with no documents.
    # When ANY image is transformed, the WHOLE album keeps every original as a
    # 「原图」 document, so the card shows a consistent「N 张照片 + M 份原图」mix.
    # The review-card media count now reflects the persisted message specs (the
    # actual visible images/pages, excluding presentation-only previews) instead
    # of the Telegram album/container count. Rollback = 2.73.2.
    # 2.73.10 (2026-10-01): Mini App production repair. Bot-side entry gate
    # (config/settings.MINIAPP_ENABLED) and the Mini App session gate
    # (miniapp/auth.init_data_enabled) now share ONE
    # enabled-unless-explicitly-disabled default contract (was: Bot side
    # default-off vs session side default-on, so bot1 chat replied "Mini App
    # 尚未启用" while the app was served, and bot2 users hit the misleading
    # "请在 Telegram 中打开" fallback). Reviewer 审核历史 added:
    # GET /api/v1/reviews/history (terminal states, updated_at keyset paging,
    # reviewer/admin RBAC) + Mini App /review/history page, both projecting the
    # SAME ReviewService state as the pending queue. Rollback = 2.73.9.
    # 2.73.12 (2026-10-02): online-reading image restoration. The in-process
    # TelePress library only read TELEPRESS_MEDIA_PROXY_* while production only
    # set MEDIA_PROXY_BASE_URL/HOSTS, so proxy rewriting was silently skipped
    # and every rich-novel Telegraph page went out text-only. The provider
    # assembly now bridges TelePost's media-proxy config into the library
    # (explicit TELEPRESS_* still wins), telepress pin 0.17.0 adds a loud
    # warning when a manifest proxies to nothing, and the TELEPRESS_* env
    # stopgap below stays as belt-and-braces. Also carries 2.73.11 (per-bot
    # release version diagnostics). Rollback = 2.73.10.
    # 2.74.0 (2026-10-02): Mini App review-queue empty state explains itself —
    # the queue holds only transient pending rows (reviews happen on the TG
    # group control cards, entries expire after 24h), so the empty state now
    # shows up to three recent terminal records plus a review-history link
    # (existing GET /reviews/history), degrading silently on peek failure.
    # Pure frontend, zero API contract change. Rollback = 2.73.12.
    # 2.75.0 (2026-10-02): source-neutral work_id on the submission API —
    # JSON + multipart accept work_id (canonical) with pixiv_id kept as a
    # deprecated alias (work_id wins when both are sent); deliveries/lookup
    # takes a work_id query alias and returns both keys. Zero-migration:
    # storage columns + audit key stay pixiv_id (persisted schema), mapped
    # at the repository boundary. Old producers (pixiv_id only) are
    # unaffected. Rollback = 2.74.0.
    # 2.76.0 (2026-10-02): channel novel posts with a Telegraph preview page
    # move their caption onto a trailing TEXT message whose bare read-online
    # URL earns the Telegram link preview / Instant View card (media captions
    # never get one); the send layer emits LinkPreviewOptions(url=…,
    # prefer_large_media=True) for that message only. Review/preview surfaces
    # and preview-less submissions are byte-identical to before;
    # READONLINE_LINK_PREVIEW=false restores the old form outright.
    # Rollback = 2.75.0.
    # 2.76.1 (2026-10-02): root-caption completeness + read-online entrance
    # dedupe. In discussion mode the preview URL no longer forces the caption
    # into the trailing comment text; the channel root keeps the full caption
    # (no READ_ONLINE footer) and a separate two-line bare-link message owns
    # the IV card in the discussion thread. Multi-document caption trailing
    # form is preserved with the bare link as its own tail item.
    # Rollback = 2.76.0.
    # 2.76.2 (2026-10-02): telepress dependency bump (pagination
    # page-turn frequency reduced for long markdown payloads).
    # Rollback = 2.76.1.
    # Pinned from versions.json (TelePost v2.81.5, synced 2026-10-10). Rollback = 2.81.4.
    TELEPOST_IMAGE = 'ghcr.io/redtidev1918/telepost:2.81.5'

[[mounts]]
  source = 'data'
  destination = '/app/data'

[env]
  MEDIA_PROXY_BASE_URL = 'https://pixiv-media-proxy.redtidev1918.workers.dev'
  MEDIA_PROXY_HOSTS = 'i.pximg.net'
  # 2026-10-02 stopgap for the text-only 在线阅读 incident: the in-process
  # TelePress library reads its own TELEPRESS_MEDIA_PROXY_* names, so the
  # TelePost pair alone left proxy rewriting silently skipped and Telegraph
  # dropped every relative-path inline image. Keep in sync with the pair
  # above until the TelePost-side env bridge (telepress_provider) makes the
  # mapping automatic; after that these two lines are belt-and-braces.
  TELEPRESS_MEDIA_PROXY_BASE = 'https://pixiv-media-proxy.redtidev1918.workers.dev'
  TELEPRESS_MEDIA_PROXY_HOSTS = 'i.pximg.net'
  RUN_MODE = 'WEBHOOK'
  CHANNEL_ALBUM_REPLY = 'discussion'
  WEBHOOK_PATH = '/webhook'
  ROUTER_CHILD_READY_TIMEOUT = '120'
  PENDING_REVIEW_RETENTION_DAYS = '1'
  PENDING_REVIEW_CLEANUP_BATCH_SIZE = '20'
  # Replaced (superseded) review cards are deleted after this many days;
  # refetch lineage (attempts / seen candidates) is kept regardless. 0 disables.
  SUPERSEDED_RETENTION_DAYS = '14'
  # Refetch progress: remind the review group after 5 min of silence, fail the
  # attempt with a user-visible notice after 45 min with no terminal outcome.
  REFETCH_PROGRESS_REMIND_MINUTES = '5'
  REFETCH_STALE_TIMEOUT_MINUTES = '45'
  # Watchdog recovery: same-UUID idempotent wake after 12 min without progress,
  # hard-stall the attempt (failed + notified) after 90 min with no terminal.
  REFETCH_WAKE_MINUTES = '12'
  REFETCH_HARD_TIMEOUT_MINUTES = '90'
  REVIEW_PREVIEW_THREAD = '1'
  REVIEW_PREVIEW_INTERVAL_SECONDS = '0.75'
  REVIEW_PREVIEW_TIMEOUT_SECONDS = '120'
  REVIEW_ALBUM_SIZE = '10'
  # Submitter publication notification (2.27.0): one durable idempotent DM per
  # publication, triggered by publication success only (never by review
  # approval). 'with_changes' also lists what the channel owner edited before
  # publishing. off = feature dormant (default). Anonymous humans are still
  # notified privately; service submissions (no human submitter) never are.
  SUBMITTER_PUBLISH_NOTIFY = 'with_changes'
  SEARCH_ENABLED = 'false'
  SEARCH_ANALYZER = 'simple'
  DB_CACHE_KB = '1024'
  TZ = 'Asia/Shanghai'
  # Review-group refetch reaches the sleeping PixivFlow executor through Fly's
  # HTTPS proxy; PIXIVFLOW_REFETCH_TOKEN is a separate shared Secret.
  PIXIVFLOW_REFETCH_BASE_URL = 'https://pixivflow-scheduler.fly.dev'
  # 2026-09-27 现场验收先在旧通道上恢复服务；生产者侧修复（PixivFlow 3.4.0，
  # 协议 v1.1）发布并部署后，本行恢复为协议通道（也是 TelePost 的默认值）。
  # 背景：协议 v1 要求 params.query，且通用面只从配置解析目标——本部署有四个
  # 满足 targetServesManualCandidateSearch 的 target，于是 2.71.0 的请求体必然
  # 被 HTTP 409 ambiguous_target 拒绝（旧 URL 通道不受影响，所以缺陷是协议面的）。
  # v1.1 把 params.target_id 变成合法**选择器**、让 params.query 可选（缺省即
  # 该目标自身的检索配置，与旧 refetch 语义等价），并让 /capabilities 声明
  # `target_selector`。现场验收（§2026-09-28，--live --legacy-refetch-target）通过。
  # 再次回滚：把本行改成 'legacy'（旧 URL 通道在 executor 上仍然保留）。
  PIXIVFLOW_JOB_TRANSPORT = 'protocol'
  # Telegram Mini App surface. dist/ is served same-domain at /app/ by the
  # TelePost webhook server (2.21.1); MINIAPP_SESSION_SECRET is a separate
  # shared Secret (≥32 chars, never the bot token). Rollback: set back to false.
  MINIAPP_ENABLED = 'true'
  MINIAPP_SESSION_TTL = '1800'
  # Mini App submissions are verified HUMAN entries: they follow an
  # independent review switch (never bound to API_REVIEW_REQUIRED). true keeps
  # them in the review queue (pre-2.35.0 production behavior).
  MINIAPP_REVIEW_REQUIRED = 'true'
  # Channel-publish footer (2.23.0): confirmed channel posts carry a 点击投稿
  # link pointing to the publishing bot, so channel readers can start their own
  # submission. Review previews/queueing never include it. Per-bot override so
  # each bot points at itself; empty (= unset) disables the footer.
  BOT1_CHANNEL_FOOTER_LINK = 'https://t.me/xgdPost_bot'
  BOT2_CHANNEL_FOOTER_LINK = 'https://t.me/vorePost_bot'
  # Submission CTA (2.30.0): when enabled the channel footer opens the OWNING
  # bot's Mini App submission page directly (https://t.me/<bot>?startapp=submit;
  # startapp is navigation intent only — auth stays server-validated initData).
  # Unset/false keeps the pre-existing bot deep link — never a broken link.
  BOT1_MINIAPP_SUBMIT_CTA = 'true'
  BOT2_MINIAPP_SUBMIT_CTA = 'true'
  # Novel TXT Telegraph preview (2.31.0): OPTIONAL enrichment. The TXT
  # document remains the authoritative downloadable artifact; Telegraph
  # failure/timeout never fails a publication; one Telegraph page per
  # publication (retries reuse the URL). Requires the TELEGRAPH_ACCESS_TOKEN
  # secret (fly secrets set; never logged/comitted). Rollback: set to 'false'.
  NOVEL_PREVIEW_ENABLED = 'true'
  NOVEL_PREVIEW_TIMEOUT_SECONDS = '15'

[http_service]
  internal_port = 8080
  # Plain HTTP stays acceptable on the private network: the PixivFlow worker
  # delivers submissions to this app over Flycast (WireGuard-protected 6PN), and
  # force_https would 301 that delivery into a dead end. The Telegram webhook and
  # the review API are reached over public HTTPS regardless.
  force_https = false
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # A long-lived service keeps a long-lived liveness check. It reads /health, which
  # answers immediately and does not gate on the children's readiness, so it cannot
  # fight the always-on state.
  [[http_service.checks]]
    grace_period = '60s'
    interval = '30s'
    method = 'GET'
    timeout = '10s'
    path = '/health'

[[restart]]
  policy = 'always'



