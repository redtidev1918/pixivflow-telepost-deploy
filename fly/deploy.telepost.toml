# TelePost 独立实例（拆两台：不含 PixivFlow，只跑投稿/审核 bot）
#
# 与「合一台」的 fly/deploy.fly-multi-bot.toml 相对：直接用 TelePost 预构建镜像，
# 不启用 PixivFlow（PixivFlow 拆到 fly/deploy.pixivflow.toml 单独部署）。
#
# 部署步骤：
#   fly apps create <your-telepost-app>
#   fly volumes create data --size 1 -r iad
#   fly secrets set -a <your-telepost-app> BOT1_TOKEN=... BOT1_CHANNEL_ID=... \
#       TELEPOST_BOT1_SUBMIT_TOKEN=... TELEPOST_BOT2_SUBMIT_TOKEN=...
#   fly deploy -c fly/deploy.telepost.toml

app = "your-telepost-app"
primary_region = "iad"

[build]
  image = "ghcr.io/redtidev1918/telepost:2.10.38"

[env]
  PYTHONUNBUFFERED = "1"
  PYTHONDONTWRITEBYTECODE = "1"
  TZ = "Asia/Shanghai"
  RUN_MODE = "WEBHOOK"
  WEBHOOK_URL = "https://your-telepost-app.fly.dev"
  SEARCH_ANALYZER = "simple"
  SEARCH_ENABLED = "false"
  DB_CACHE_KB = "1024"
  # 投稿 token：TelePost 用它们校验 PixivFlow（独立实例）的 HTTP 投稿
  REVIEW_PREVIEW_THREAD = "1"
  REVIEW_PREVIEW_INTERVAL_SECONDS = "0.75"
  REVIEW_PREVIEW_TIMEOUT_SECONDS = "120"
  REVIEW_ALBUM_SIZE = "5"
  PENDING_REVIEW_RETENTION_DAYS = "1"
  PENDING_REVIEW_CLEANUP_BATCH_SIZE = "20"
  REVIEW_RETENTION_DAYS = "30"

[mounts]
  source = "data"
  destination = "/app/data"

[http_service]
  internal_port = 8080
  force_https = false   # 关闭：让 Flycast 私网 HTTP（port 80→8080）直通，不 301 跳 HTTPS
  # TelePost 是 event-driven（webhook/用户投稿/PixivFlow 投递都是入站），可 auto-stop：
  # 无流量时停机省 RAM，来入站请求（经 Fly Proxy）自动拉起。
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "120s"
    interval = "60s"
    method = "GET"
    timeout = "30s"
    path = "/health"

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
