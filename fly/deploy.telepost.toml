# TelePost: the always-on submission / review / publish service.
#
# TelePost is the only thing that talks to Telegram. Users submit in private chat,
# reviewers approve or reject, and an approved work is published to the channel by
# this app - never by an execution machine.
#
# It must never sleep: a submission bot that is cold-starting looks broken to the
# user, and there is no cost model that makes a user-visible submit button wait
# for a machine to boot. The PixivFlow worker is where the "stopped by default"
# saving comes from; this service stays resident.
#
# Deploy (the app name comes from this file, so no -a):
#   fly deploy -c fly/deploy.telepost.toml --ha=false

app = 'telesubmit-multi-bot'
primary_region = 'iad'

[build]
  dockerfile = '../docker/telepost.Dockerfile'
  [build.args]
    # Pin the released TelePost image. Never `latest`: a floating reference makes
    # "the same config" produce different code on different days.
    TELEPOST_IMAGE = 'ghcr.io/redtidev1918/telepost:2.17.2'

[[mounts]]
  source = 'data'
  destination = '/app/data'

[env]
  RUN_MODE = 'WEBHOOK'
  WEBHOOK_PATH = '/webhook'
  ROUTER_CHILD_READY_TIMEOUT = '120'
  PENDING_REVIEW_RETENTION_DAYS = '1'
  PENDING_REVIEW_CLEANUP_BATCH_SIZE = '20'
  REVIEW_PREVIEW_THREAD = '1'
  REVIEW_PREVIEW_INTERVAL_SECONDS = '0.75'
  REVIEW_PREVIEW_TIMEOUT_SECONDS = '120'
  SEARCH_ENABLED = 'false'
  SEARCH_ANALYZER = 'simple'
  DB_CACHE_KB = '1024'
  TZ = 'Asia/Shanghai'

[http_service]
  internal_port = 8080
  # Plain HTTP stays acceptable on the private network: the PixivFlow worker
  # delivers submissions to this app over Flycast (WireGuard-protected 6PN), and
  # force_https would 301 that delivery into a dead end. The Telegram webhook and
  # the review API are reached over public HTTPS regardless.
  force_https = false
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # A long-lived service keeps a long-lived liveness check. It reads /health, which
  # answers immediately and does not gate on the children's readiness, so it cannot
  # fight the always-on state.
  [[http_service.checks]]
    grace_period = '60s'
    interval = '30s'
    method = 'GET'
    timeout = '10s'
    path = '/health'

[restart]
  policy = 'always'
