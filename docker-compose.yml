name: pixivflow-telepost

# 解耦部署：TelePost 与 PixivFlow 各是一个独立容器，通过 HTTP 通信。
# 默认「合一台」——两个 service 落在同一台 Docker 主机，共享 data 卷与 app 网络；
# 要「拆两台」时，只需把 pixivflow 服务部署到另一台主机（把 TELEPOST_API_BASE_URL
# 指向 telepost 的公网地址即可）。

services:
  telepost:
    image: ${TELEPOST_IMAGE:-ghcr.io/redtidev1918/telepost:2.10.38}
    restart: unless-stopped
    init: true
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      RUN_MODE: ${RUN_MODE:-AUTO}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_PORT: 8080
      HEALTH_PORT: 8080
      API_ENABLED: "true"
      # 审核群多页预览：每批最多 10 张组成相册；1=后续批次回复上一批
      REVIEW_PREVIEW_THREAD: ${REVIEW_PREVIEW_THREAD:-1}
      REVIEW_PREVIEW_INTERVAL_SECONDS: ${REVIEW_PREVIEW_INTERVAL_SECONDS:-0.75}
      REVIEW_PREVIEW_TIMEOUT_SECONDS: ${REVIEW_PREVIEW_TIMEOUT_SECONDS:-120}
      REVIEW_ALBUM_SIZE: ${REVIEW_ALBUM_SIZE:-5}
      PENDING_REVIEW_RETENTION_DAYS: ${PENDING_REVIEW_RETENTION_DAYS:-1}
      PENDING_REVIEW_CLEANUP_BATCH_SIZE: ${PENDING_REVIEW_CLEANUP_BATCH_SIZE:-20}
      REVIEW_RETENTION_DAYS: ${REVIEW_RETENTION_DAYS:-30}
      BOT1_TOKEN: ${BOT1_TOKEN:-}
      BOT1_CHANNEL_ID: ${BOT1_CHANNEL_ID:-}
      BOT1_OWNER_ID: ${BOT1_OWNER_ID:-}
      BOT1_BOT_MODE: ${BOT1_BOT_MODE:-MIXED}
      BOT1_API_REVIEW_REQUIRED: ${BOT1_API_REVIEW_REQUIRED:-true}
      BOT1_CHAT_REVIEW_REQUIRED: ${BOT1_CHAT_REVIEW_REQUIRED:-false}
      BOT1_REVIEW_CHAT_ID: ${BOT1_REVIEW_CHAT_ID:-}
      BOT1_WEBHOOK_SECRET_TOKEN: ${BOT1_WEBHOOK_SECRET_TOKEN:-}
      BOT2_TOKEN: ${BOT2_TOKEN:-}
      BOT2_CHANNEL_ID: ${BOT2_CHANNEL_ID:-}
      BOT2_OWNER_ID: ${BOT2_OWNER_ID:-}
      BOT2_BOT_MODE: ${BOT2_BOT_MODE:-MIXED}
      BOT2_API_REVIEW_REQUIRED: ${BOT2_API_REVIEW_REQUIRED:-true}
      BOT2_CHAT_REVIEW_REQUIRED: ${BOT2_CHAT_REVIEW_REQUIRED:-false}
      BOT2_REVIEW_CHAT_ID: ${BOT2_REVIEW_CHAT_ID:-}
      BOT2_WEBHOOK_SECRET_TOKEN: ${BOT2_WEBHOOK_SECRET_TOKEN:-}
      # 投稿 token：TelePost 用它们校验 PixivFlow 的 HTTP 投稿
      TELEPOST_BOT1_SUBMIT_TOKEN: ${TELEPOST_BOT1_SUBMIT_TOKEN:-}
      TELEPOST_BOT2_SUBMIT_TOKEN: ${TELEPOST_BOT2_SUBMIT_TOKEN:-}
      SEARCH_ENABLED: ${SEARCH_ENABLED:-false}
      SEARCH_ANALYZER: ${SEARCH_ANALYZER:-simple}
      DB_CACHE_KB: ${DB_CACHE_KB:-1024}
      MALLOC_ARENA_MAX: ${MALLOC_ARENA_MAX:-2}
      HTTP_PROXY: ${HTTP_PROXY_URL:-}
      HTTPS_PROXY: ${HTTP_PROXY_URL:-}
      ALL_PROXY: ${EGRESS_ALL_PROXY:-}
      NO_PROXY: 127.0.0.1,localhost,telepost,pixivflow,proxy
      no_proxy: 127.0.0.1,localhost,telepost,pixivflow,proxy
    volumes:
      - ./data:/app/data
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    mem_limit: ${TELEPOST_MEMORY_LIMIT:-320m}
    cpus: ${CPU_LIMIT:-1.0}
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - app
    logging: &default-logging
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILES:-3}

  pixivflow:
    image: ${PIXIVFLOW_IMAGE:-ghcr.io/redtidev1918/pixivflow:2.10.28}
    restart: unless-stopped
    init: true
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # 配置文件（与 telepost 共享 ./data 卷，落在 ./data/pixivflow/config.json）
      PIXIV_DOWNLOADER_CONFIG: /app/data/pixivflow/config.json
      PIXIV_REFRESH_TOKEN: ${PIXIV_REFRESH_TOKEN:-}
      # 投递目标：默认同机 telepost 容器；拆两台时改成 telepost 的公网地址
      TELEPOST_API_BASE_URL: ${TELEPOST_API_BASE_URL:-http://telepost:8080}
      TELEPOST_BOT1_SUBMIT_TOKEN: ${TELEPOST_BOT1_SUBMIT_TOKEN:-}
      TELEPOST_BOT2_SUBMIT_TOKEN: ${TELEPOST_BOT2_SUBMIT_TOKEN:-}
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=96 --expose-gc}
      MALLOC_ARENA_MAX: ${MALLOC_ARENA_MAX:-2}
      PIXIV_DB_CACHE_KB: ${PIXIV_DB_CACHE_KB:-4096}
      HTTP_PROXY: ${HTTP_PROXY_URL:-}
      HTTPS_PROXY: ${HTTP_PROXY_URL:-}
      ALL_PROXY: ${EGRESS_ALL_PROXY:-}
      NO_PROXY: 127.0.0.1,localhost,telepost,pixivflow,proxy
      no_proxy: 127.0.0.1,localhost,telepost,pixivflow,proxy
    volumes:
      - ./data:/app/data
    depends_on:
      telepost:
        condition: service_healthy
    mem_limit: ${PIXIVFLOW_MEMORY_LIMIT:-192m}
    cpus: ${CPU_LIMIT:-1.0}
    pids_limit: 256
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(require('fs').existsSync('/app/data/pixivflow/config.json') ? 0 : 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - app
    logging: *default-logging

  # 公网 HTTPS 反代。只有运行 `docker compose --profile webhook up -d` 才启动。
  caddy:
    image: caddy:2-alpine
    profiles: [webhook]
    restart: unless-stopped
    environment:
      WEBHOOK_DOMAIN: ${WEBHOOK_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      telepost:
        condition: service_healthy
    networks:
      - app
    logging: *default-logging

  # 国内网络的可选代理。512 MiB 整机优先使用外部代理，避免与主服务争内存。
  proxy:
    build:
      context: ./proxy
    image: pixivflow-telepost-mihomo:local
    profiles: [proxy]
    restart: unless-stopped
    environment:
      SUB_URL: ${SUB_URL:-}
    ports:
      - "127.0.0.1:${PROXY_PORT:-7890}:7890"
      - "127.0.0.1:${PROXY_CONTROLLER_PORT:-9090}:9090"
    volumes:
      - ./proxy-data:/root/.config/mihomo
    mem_limit: ${PROXY_MEMORY_LIMIT:-128m}
    networks:
      - app
    logging: *default-logging

networks:
  app:

volumes:
  caddy-data:
  caddy-config:
