# Optional watchdog for the external-clock (Fly autosleep) schedule trigger.
#
# This is NOT the primary clock — the Cloudflare Worker is. It re-POSTs the same
# idempotent schedule trigger ~20-30 minutes AFTER each scheduled fire, so a
# missed/失败的 primary trigger is resumed while still inside PixivFlow's grace
# window. If the primary already ran the occurrence, PixivFlow answers
# a terminal 409/425 and nothing is re-posted; if it failed or the machine never
# woke, this resumes the SAME canonical occurrence inside the 90 min grace window.
# Safe to leave disabled — the system is correct without a watchdog.
#
# Example (Asia/Shanghai), primary Cloudflare vs watchdog GitHub:
#   bot1-daily  primary 10:00/18:00 -> watchdog 10:20/18:20
#   bot2-daily  primary 10:10/18:10 -> watchdog 10:30/18:30
# Cron is UTC (Beijing = UTC+8). Schedule ids are data-driven (no hardcoded ids):
# edit SCHEDULE_MAP to bind each firing cron to YOUR PixivFlow schedule id
# (config `schedules[].id`).
#
# Setup in YOUR deploy/ops repo (this file is a template):
#   gh secret set SCHEDULE_TRIGGER_URL   --repo <you>/<repo>  # base URL https://<app>.fly.dev
#   gh secret set SCHEDULE_TRIGGER_TOKEN --repo <you>/<repo>  # == PixivFlow SCHEDULER_TRIGGER_TOKEN
# then enable the workflow.
name: schedule-watchdog

on:
  schedule:
    - cron: "20 2 * * *"    # bot1 watchdog 10:20 Beijing (primary 10:00)
    - cron: "30 2 * * *"    # bot2 watchdog 10:30 Beijing (primary 10:10)
    - cron: "20 10 * * *"   # bot1 watchdog 18:20 Beijing (primary 18:00)
    - cron: "30 10 * * *"   # bot2 watchdog 18:30 Beijing (primary 18:10)
  workflow_dispatch:
    inputs:
      schedule_id:
        description: "PixivFlow schedule id to trigger (manual)"
        required: false
        default: ""

env:
  # Bind each firing cron (exact match to the crons above) to a schedule id.
  SCHEDULE_MAP: >-
    {"20 2 * * *":"bot1-daily","30 2 * * *":"bot2-daily","20 10 * * *":"bot1-daily","30 10 * * *":"bot2-daily"}

jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve schedule id for this cron
        id: sched
        run: |
          MANUAL="${{ github.event.inputs.schedule_id }}"
          if [ -n "$MANUAL" ]; then
            echo "id=$MANUAL" >> "$GITHUB_OUTPUT"
          else
            # GitHub sets the schedule cron that fired via github.event.schedule.
            CRON="${{ github.event.schedule }}"
            ID=$(printf '%s' "$SCHEDULE_MAP" | python3 -c \
              'import sys,json; m=json.load(sys.stdin); print(m.get(sys.argv[1],""))' "$CRON")
            if [ -z "$ID" ]; then
              echo "No schedule id mapped for cron '$CRON'"; exit 1
            fi
            echo "id=$ID" >> "$GITHUB_OUTPUT"
          fi
      - name: POST idempotent schedule trigger
        run: |
          BASE="${SCHEDULE_TRIGGER_URL%/}"
          curl -sS --fail-with-body --max-time 500 \
            -X POST "$BASE/internal/schedules/${{ steps.sched.outputs.id }}/run" \
            -H "Authorization: Bearer $SCHEDULE_TRIGGER_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}'
        env:
          SCHEDULE_TRIGGER_URL: ${{ secrets.SCHEDULE_TRIGGER_URL }}
          SCHEDULE_TRIGGER_TOKEN: ${{ secrets.SCHEDULE_TRIGGER_TOKEN }}