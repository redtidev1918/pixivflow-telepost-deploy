name: Feature request
description: 建议通用的部署、运维或可移植性改进
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述通用场景，而不只是某台机器的临时配置。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 可能所属项目
      options:
        - 本部署仓库
        - PixivFlow
        - TelePost
        - 不确定
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与兼容性影响
