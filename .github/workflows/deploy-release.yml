name: Release deploy binary

# 编译 Go 单二进制（deploy）到多平台，附加到 GitHub Release。
# 触发：推送 deploy-v* 标签（如 deploy-v3.0.0）。

on:
  push:
    tags:
      - "deploy-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          out="deploy-${{ matrix.goos }}-${{ matrix.goarch }}"
          [ "$GOOS" = "windows" ] && out="${out}.exe"
          go build -trimpath -ldflags "-s -w" -o "$out" deploy.go
          echo "BINARY=$out" >> "$GITHUB_ENV"
      - name: Archive
        env:
          OS: ${{ matrix.goos }}
          ARCH: ${{ matrix.goarch }}
        run: |
          if [ "$OS" = "windows" ]; then
            zip -j "deploy-$OS-$ARCH.zip" "$BINARY"
          else
            tar -czf "deploy-$OS-$ARCH.tar.gz" "$BINARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: deploy-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            deploy-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
            deploy-${{ matrix.goos }}-${{ matrix.goarch }}.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
