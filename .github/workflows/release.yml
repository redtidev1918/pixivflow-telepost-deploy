name: Release

# 全自动发版，无需任何 PAT/secret：main 上合入 release-worthy 提交后，release-please
# 在本工作流内开/更发版 PR；发版 PR 合并后同一个 run 内推 tag，后续 image/bundle/release
# job 直接在本 run 内运行（不依赖 tag push 触发新工作流，内置 GITHUB_TOKEN 即可）。
# 仍支持手动推 v* tag / workflow_dispatch 重跑（release-please 不在这两种场景运行）。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 要重跑/重发布的已有 tag（如 v1.9.4）；main push 自动发版时忽略此输入
        required: true
        type: string
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.rp.outputs.releases_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Release Please
        id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # 发版 job 只在「main push 且 release-please 刚发版」或「tag/dispatch 重跑」时执行。
  validate:
    runs-on: ubuntu-latest
    needs: release-please
    if: >-
      github.event_name != 'push' ||
      github.ref == 'refs/heads/main' && needs.release-please.outputs.releases_created == 'true' ||
      startsWith(github.ref, 'refs/tags/')
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name || inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Install shell lint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
      - name: Validate examples and Compose
        run: ./scripts/validate.sh --examples
      - name: Verify release notes exist
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          python3 scripts/extract_changelog.py "$TAG_VERSION" >/dev/null

  image:
    runs-on: ubuntu-latest
    needs: [release-please, validate]
    if: >-
      github.event_name != 'push' ||
      github.ref == 'refs/heads/main' && needs.release-please.outputs.releases_created == 'true' ||
      startsWith(github.ref, 'refs/tags/')
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag || github.ref_name }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name || inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: imgtags
        run: |
          # GHCR 镜像 tag 不带 v 前缀（如 1.9.3），git/release tag 带 v（v1.9.3）。
          # 自动发版时 run 触发于 main，metadata action 的 type=semver 取不到 git tag，
          # 所以统一从 RELEASE_TAG 派生全量 tag 与 major.minor tag（两种触发路径都生效）。
          V="${RELEASE_TAG#v}"
          echo "full=$V" >> "$GITHUB_OUTPUT"
          echo "minor=${V%%.*}.$(echo "$V" | cut -d. -f2)" >> "$GITHUB_OUTPUT"
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/pixivflow-telepost-deploy
          tags: |
            type=raw,value=${{ steps.imgtags.outputs.full }}
            type=raw,value=${{ steps.imgtags.outputs.minor }}
            type=raw,value=latest

      - name: Build and push amd64/arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/combined.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 把 deploy 单二进制也打进套件 release，让「Deployment Kit」release 不是空的。
  bundle:
    runs-on: ubuntu-latest
    needs: [release-please, validate]
    if: >-
      github.event_name != 'push' ||
      github.ref == 'refs/heads/main' && needs.release-please.outputs.releases_created == 'true' ||
      startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name || inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          out="deploy-${{ matrix.os }}-${{ matrix.arch }}"
          if [ "${{ matrix.os }}" = "windows" ]; then out="$out.exe"; fi
          go build -trimpath -ldflags "-s -w" -o "$out" .
          tar -czf "deploy-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" "$out"
      - uses: actions/upload-artifact@v7
        with:
          name: deploy-${{ matrix.os }}-${{ matrix.arch }}
          path: deploy-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [release-please, bundle]  # CLI 二进制独立发布；image 失败不阻塞二进制上架
    if: >-
      github.event_name != 'push' ||
      github.ref == 'refs/heads/main' && needs.release-please.outputs.releases_created == 'true' ||
      startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name || inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Prepare release notes
        run: |
          python3 scripts/extract_changelog.py "$RELEASE_TAG" > release-notes.md
          {
            echo
            echo "## 怎么用（普通用户，三步）"
            echo
            echo "1. 下载下方对应你系统的 \`deploy-*.tar.gz\`（Windows / macOS / Linux）"
            echo "2. 解压得到 \`deploy\` 单文件"
            echo "3. 终端运行 \`./deploy\`，按提示一路回车即可"
            echo
            echo "> \`deploy\` 就是本套件的一键部署工具；「Deployment Kit」是这一整套的总称"
            echo "> （deploy 工具 + Docker 镜像 + 配置模板）。普通用户只需下载 deploy 那一个文件。"
            echo
            echo "## 这个 release 包含什么"
            echo
            echo "- **deploy 单文件**：6 个压缩包（Windows / macOS / Linux 各 2 种架构）"
            echo "- **Docker 镜像**：\`ghcr.io/redtidev1918/pixivflow-telepost-deploy:${RELEASE_TAG#v}\`"
            echo "- **源码**：\`git clone\` 后 \`docker compose up -d\` 一键启动"
          } >> release-notes.md
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: deploy-*
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # release-please 在本 run 内已创建 GitHub release；重跑时幂等处理，不重复创建。
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "Deployment Kit $RELEASE_TAG" \
              --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" --verify-tag \
              --notes-file release-notes.md --title "Deployment Kit $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" dist/*.tar.gz --clobber
      - name: Prune old releases (keep latest per track)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/prune_releases.py

  # 发版后自动更新下载页并部署 Pages——必须在同一 run 内完成：
  # release:published 事件和后续 main push 都不会触发新工作流（GITHUB_TOKEN 限制）。
  download-page:
    name: Update download page and deploy Pages
    needs: [release-please, release]
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Generate docs/download.md from latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/update_download_page.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/download.md
          if git diff --cached --quiet; then
            echo "download page unchanged"
          else
            git commit -m "docs: 自动更新下载页（指向最新 Release）"
            git pull --rebase origin main || true
            git push
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './docs'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
