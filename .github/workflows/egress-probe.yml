name: egress-probe

# Qualification probe: what can THIS egress actually do against Pixiv's data planes?
#
# Reachability is not suitability. An egress can pass OAuth and still be rate-limit
# starved on the production search workload (measured from GitHub-hosted runners on
# 2026-09-11). So this runs PixivFlow's own `diagnose egress` command — one OAuth
# exchange, one small App API request, one 64 KiB media Range request — on the runner
# whose network is being qualified, and emits one matrix row: PASS / DEGRADED / FAIL.
#
# It deliberately uses the SAME code and the SAME control-plane credential the
# execution plane uses: the question is what this network does with the production
# workload, not what a mock says it would do.
#
# OAuth is the one probe that mutates state: Pixiv may return a NEW refresh token.
#   * oauth_refresh=false (the default) sets PIXIV_AUTH_READONLY, which leaves the
#     token endpoint untested. The row is then honest about that (OAuth
#     DEGRADED/unqualified) instead of silently rotating the production credential.
#   * oauth_refresh=true performs the real exchange. The rotated value is persisted to
#     the control plane BEFORE the job is allowed to pass, exactly as a production
#     execution does; if it cannot be stored, the job fails and keeps the value as an
#     artifact rather than reporting a clean run.
#
# Serialisation: the concurrency group is the CREDENTIAL, the same group
# pixivflow-batch.yml uses. A probe that rotated the token while a production
# execution held it would take the account away from that run, so the two must never
# overlap.
#
# This workflow is not a scheduler and holds no state: it measures, then reports.

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'Provider label for the matrix row (e.g. github-hosted, fly-ams)'
        required: true
        default: 'github-hosted'
        type: string
      region:
        description: 'Region / runner label for the matrix row (e.g. github-ubuntu, ams)'
        required: true
        default: 'github-ubuntu'
        type: string
      runs_on:
        description: 'Runner label to probe; a self-hosted label measures that machine'
        required: true
        default: 'ubuntu-latest'
        type: string
      pixivflow_ref:
        description: 'PixivFlow git ref to run'
        required: false
        type: string
        default: 'master'
      credential_key:
        description: 'Control-plane credential to probe with'
        required: true
        default: 'pixiv-main'
        type: string
      callback_url:
        description: 'Control-plane base URL (blank = vars.CONTROL_PLANE_CALLBACK_URL)'
        required: false
        type: string
        default: ''
      oauth_refresh:
        description: 'true = perform the REAL token refresh (rotates the credential; stored before the job may pass)'
        required: false
        type: boolean
        default: false
      illust_id:
        description: 'Illust id for the single App API request'
        required: false
        type: string
        default: '92421724'

concurrency:
  group: pixivflow-${{ inputs.credential_key }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ${{ inputs.runs_on }}
    # Each probe request is bounded by a 15s timeout inside the command; this is the
    # hard stop for a wedged network, not a budget to spend.
    timeout-minutes: 15
    env:
      PROVIDER: ${{ inputs.provider }}
      REGION: ${{ inputs.region }}
      ILLUST_ID: ${{ inputs.illust_id }}
      CREDENTIAL_KEY: ${{ inputs.credential_key }}
      CALLBACK_URL: ${{ inputs.callback_url || vars.CONTROL_PLANE_CALLBACK_URL }}
      CONTROL_SECRET: ${{ secrets.CALLBACK_SECRET }}
      # The shadow config names these four; no delivery token is needed to probe a
      # network, so none is exposed to this job.
      PIXIV_CLIENT_ID: ${{ secrets.PIXIV_CLIENT_ID }}
      PIXIV_CLIENT_SECRET: ${{ secrets.PIXIV_CLIENT_SECRET }}
      PIXIV_DEVICE_TOKEN: ${{ secrets.PIXIV_DEVICE_TOKEN }}
      # Default is the read-only path: a probe must not rotate the production
      # credential by accident, and the untested OAuth plane is reported as such.
      PIXIV_AUTH_READONLY: ${{ inputs.oauth_refresh && 'false' || 'true' }}
    steps:
      # The control plane is the only durable holder of the Pixiv credential, so the
      # newest rotated value is read here rather than from a long-lived GitHub secret.
      - name: Resolve the Pixiv credential
        env:
          FALLBACK_TOKEN: ${{ secrets.PIXIV_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          token=""
          if [ -n "${CALLBACK_URL:-}" ]; then
            if response=$(curl -sS --max-time 20 -X POST \
                -H "authorization: Bearer $CONTROL_SECRET" \
                "${CALLBACK_URL%/}/credentials/${CREDENTIAL_KEY}/read" 2>/dev/null); then
              token=$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("value",""))' 2>/dev/null || true)
            fi
          else
            echo "::warning::no control-plane URL configured; using the fallback secret only"
          fi
          source="control-plane"
          if [ -z "$token" ]; then
            token="$FALLBACK_TOKEN"
            source="github-secret"
          fi
          if [ -z "$token" ]; then
            echo "::error::no Pixiv credential available from the control plane or the fallback secret"
            exit 1
          fi
          # Mask before it can reach any output; the value is never printed.
          echo "::add-mask::$token"
          printf 'PIXIV_REFRESH_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
          echo "credential resolved from: $source"

      - name: Checkout the control plane (for the versioned config)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout PixivFlow at the requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: redtidev1918/PixivFlow
          ref: ${{ inputs.pixivflow_ref }}
          path: pixivflow-src
          persist-credentials: false

      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4
        with:
          node-version: '24'

      - name: Build PixivFlow
        working-directory: pixivflow-src
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build

      - name: Probe the egress
        id: probe
        working-directory: pixivflow-src
        # Exit code 1/2 IS the finding (DEGRADED/FAIL). Failing the step here would
        # hide the evidence that explains why, so the code is recorded as data and the
        # verdict is published in the job summary instead.
        run: |
          set +e
          node dist/index.js \
            --config "$GITHUB_WORKSPACE/control-plane/config/pixivflow.shadow.json" \
            diagnose egress --json \
            --provider "$PROVIDER" --region "$REGION" --illust-id "$ILLUST_ID" \
            > "$RUNNER_TEMP/egress.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "probe exited $code (0=no findings above warn, 1=warn, 2=critical)"
          # The log holds aliases, status codes, latencies and Retry-After values
          # only; no token can appear in it.
          exit 0

      # Pixiv may return a NEW refresh token from any refresh, and a runner is
      # destroyed when the job ends: a rotation held only here is lost along with
      # access to the account. This therefore runs BEFORE the summary is published, so
      # a probe that rotated the credential can never look like a clean measurement.
      - name: Persist a rotated credential
        id: credential
        if: always()
        run: |
          set -uo pipefail
          rotated=$(python3 - <<'PY'
          import glob, json, os, pathlib

          provided = os.environ.get('PIXIV_REFRESH_TOKEN', '').strip()
          candidates = ['control-plane/config/pixivflow.shadow.json']
          # PixivFlow's OWN storage filenames, which are a library detail: the alias
          # names the account, the file is wherever the tool keeps its token.
          candidates += glob.glob('**/.pixiv-refresh-token', recursive=True)
          candidates += glob.glob('**/.pixiv-refresh-token.backup', recursive=True)

          for name in candidates:
              path = pathlib.Path(name)
              if not path.exists():
                  continue
              try:
                  if path.suffix == '.json':
                      found = json.loads(path.read_text()).get('pixiv', {}).get('refreshToken', '')
                  else:
                      found = path.read_text().strip()
              except Exception:
                  continue
              # A placeholder is not a token: the versioned config keeps
              # ${PIXIV_REFRESH_TOKEN} until a run resolves it.
              if not found or (found.startswith('${') and found.endswith('}')):
                  continue
              if found != provided:
                  print(found)
                  break
          PY
          )
          if [ -z "$rotated" ]; then
            echo "credential: unchanged by this probe"
            exit 0
          fi
          echo "::warning::Pixiv returned a new refresh token; persisting it before publishing the result"
          printf '%s' "$rotated" > "$RUNNER_TEMP/rotated.json.payload"
          python3 -c "import json,sys; print(json.dumps({'value': open(sys.argv[1]).read()}))" \
            "$RUNNER_TEMP/rotated.json.payload" > "$RUNNER_TEMP/rotated.body"
          rm -f "$RUNNER_TEMP/rotated.json.payload"
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS --max-time 20 -o "$RUNNER_TEMP/rotated.response" -w '%{http_code}' \
              -X PUT -H "authorization: Bearer $CONTROL_SECRET" -H 'content-type: application/json' \
              --data-binary "@$RUNNER_TEMP/rotated.body" \
              "${CALLBACK_URL%/}/credentials/${CREDENTIAL_KEY}" || echo 000)
            if [ "$code" = "200" ]; then
              echo "credential: rotated value stored durably (attempt $attempt)"
              rm -f "$RUNNER_TEMP/rotated.body" "$RUNNER_TEMP/rotated.response"
              exit 0
            fi
            echo "credential: store attempt $attempt failed (HTTP $code)"
            sleep $((attempt * 5))
          done
          # Not durable. Keep the value for an operator and refuse to report success.
          printf '%s' "$rotated" > rotated-token.txt
          rm -f "$RUNNER_TEMP/rotated.body" "$RUNNER_TEMP/rotated.response"
          echo "::error::a rotated refresh token could NOT be stored durably; refusing to report this probe as clean"
          exit 1

      - name: Keep the rotated credential when persistence failed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: egress-probe-rotated-credential
          path: rotated-token.txt
          if-no-files-found: ignore
          retention-days: 7

      # The matrix row: rendered for a human, stored as JSON for the qualification
      # document. Runs even when the persistence step above failed, so the evidence
      # and the failure are visible together.
      - name: Publish the matrix row
        if: always()
        env:
          LOG: ${{ runner.temp }}/egress.log
          OUT: ${{ runner.temp }}/egress.json
          EXIT_CODE: ${{ steps.probe.outputs.exit_code }}
          RUNNER_IMAGE_OS: ${{ runner.os }}
          RUNS_ON: ${{ inputs.runs_on }}
          PIXIVFLOW_REF: ${{ inputs.pixivflow_ref }}
          OAUTH_MODE: ${{ inputs.oauth_refresh && 'refresh' || 'readonly' }}
        run: |
          set -uo pipefail
          python3 <<'PY'
          import json, os, re, sys

          log_path = os.environ['LOG']
          try:
              raw = open(log_path, 'r', errors='replace').read()
          except OSError:
              raw = ''

          # The command logs one pretty-printed JSON object: the first line carries the
          # logger prefix, the rest do not, and the top-level object closes on a line
          # that is exactly '}'.
          lines = raw.splitlines()
          start = next((i for i, line in enumerate(lines) if re.match(r'^\[[^\]]+\] \[INFO\] \{$', line)), None)
          if start is None:
              sys.stderr.write('the probe produced no JSON summary\n')
              sys.stderr.write(raw[-2000:])
              raise SystemExit('no JSON summary in the probe log')

          block = ['{']
          for line in lines[start + 1:]:
              block.append(line)
              if line == '}':
                  break
          summary = json.loads('\n'.join(block))
          summary['probe'] = {
              'provider': os.environ['PROVIDER'],
              'region': os.environ['REGION'],
              'runs_on': os.environ['RUNS_ON'],
              'pixivflow_ref': os.environ['PIXIVFLOW_REF'],
              'oauth_mode': os.environ['OAUTH_MODE'],
              'runner_os': os.environ['RUNNER_IMAGE_OS'],
              'process_exit_code': os.environ.get('EXIT_CODE', ''),
          }
          with open(os.environ['OUT'], 'w') as handle:
              json.dump(summary, handle, indent=2, sort_keys=True)

          def cell(value):
              return '—' if value is None else str(value).replace('|', '\\|')

          def ms(value):
              return '—' if value is None else f'{value} ms'

          out = sys.stdout
          out.write(f"## Egress qualification — {summary['probe']['provider']} / {summary['probe']['region']}\n\n")
          out.write(f"**verdict: {summary['verdict']}**")
          out.write(" (incomplete: some probes were skipped)\n" if summary['incomplete'] else '\n')
          out.write('\n')
          out.write(f"- runner: `{summary['probe']['runs_on']}` ({summary['probe']['runner_os']})\n")
          out.write(f"- PixivFlow ref: `{summary['probe']['pixivflow_ref']}`\n")
          out.write(f"- OAuth mode: `{summary['probe']['oauth_mode']}`\n")
          out.write(f"- process exit code: `{summary['probe']['process_exit_code']}`\n")
          out.write('\n')
          out.write('| plane | status | latency | notes |\n')
          out.write('| --- | --- | --- | --- |\n')
          oauth = summary['oauth']
          out.write(f"| OAuth | `{cell(oauth['status'])}` | {ms(oauth['latencyMs'])} | refreshed={cell(oauth['refreshed'])} |\n")
          app = summary['appApi']
          notes = []
          if app['rateLimited']:
              notes.append(f"rate limited, retry-after {ms(app['retryAfterMs'])}")
          out.write(f"| App API | {cell(app['status'])} | {ms(app['ttfbMs'])} | {'; '.join(notes) or '—'} |\n")
          media = summary['media']
          notes = ['timed out'] if media['timedOut'] else []
          out.write(f"| Media CDN | {cell(media['status'])} | {ms(media['bytes64kDurationMs'])} | {'; '.join(notes) or '64 KiB Range'} |\n")
          out.write('\n### Findings\n\n')
          out.write('| level | code | message |\n| --- | --- | --- |\n')
          for finding in summary['findings']:
              out.write(f"| {cell(finding['level'])} | `{cell(finding['code'])}` | {cell(finding['message'])} |\n")
          PY

      - name: Publish the probe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: egress-probe-${{ inputs.provider }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/egress.json
            ${{ runner.temp }}/egress.log
          if-no-files-found: warn
          retention-days: 30
