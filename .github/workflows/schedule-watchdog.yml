# Delayed watchdog (back-up trigger) for the Fly autosleep PixivFlow deployment
# (app telesubmit-multi-bot). The Cloudflare Worker is the PRIMARY clock; this
# workflow re-POSTs the SAME idempotent trigger ~20 min after each scheduled fire
# as a safety net.
#
# Normal case: the Cloudflare primary already ran the occurrence by the time this
# fires, so PixivFlow answers a terminal 409/425 and nothing re-posts (the worker
# treats 409/410/425 as expected, not failures). If the primary failed or the
# machine never woke, this resumes the SAME canonical occurrence while still inside
# the 90 min grace window (PixivFlow schedulerRuntime.trigger.graceMinutes). It is
# an HTTP trigger source only — PixivFlow owns the occurrence; duplicate/late fires
# converge on one Slot.
#
# Primary (Cloudflare) vs watchdog (this), Asia/Shanghai:
#   bot1-daily  primary 10:00 / 18:00 -> watchdog 10:20 / 18:20
#   bot2-daily  primary 10:10 / 18:10 -> watchdog 10:30 / 18:30
# Cron below is UTC (Beijing = UTC+8):
#   bot1 watchdog 10:20/18:20 Beijing = 02:20/10:20 UTC
#   bot2 watchdog 10:30/18:30 Beijing = 02:30/10:30 UTC
#
# Secrets (already set on this repo):
#   SCHEDULE_TRIGGER_URL   base URL, e.g. https://telesubmit-multi-bot.fly.dev
#   SCHEDULE_TRIGGER_TOKEN == PixivFlow SCHEDULER_TRIGGER_TOKEN
name: schedule-watchdog

on:
  schedule:
    - cron: "20 2 * * *"    # bot1 watchdog, Beijing 10:20 (primary 10:00)
    - cron: "30 2 * * *"    # bot2 watchdog, Beijing 10:30 (primary 10:10)
    - cron: "20 10 * * *"   # bot1 watchdog, Beijing 18:20 (primary 18:00)
    - cron: "30 10 * * *"   # bot2 watchdog, Beijing 18:30 (primary 18:10)
  workflow_dispatch:
    inputs:
      schedule_id:
        description: "PixivFlow schedule id to trigger manually (blank = auto from cron)"
        required: false
        default: ""

env:
  # Exact match to the crons above -> PixivFlow schedule id.
  SCHEDULE_MAP: >-
    {"20 2 * * *":"bot1-daily","30 2 * * *":"bot2-daily","20 10 * * *":"bot1-daily","30 10 * * *":"bot2-daily"}

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve schedule id for this fire
        id: sched
        run: |
          MANUAL="${{ github.event.inputs.schedule_id }}"
          if [ -n "$MANUAL" ]; then
            echo "id=$MANUAL" >> "$GITHUB_OUTPUT"
            echo "Manual trigger for schedule id: $MANUAL"
          else
            CRON="${{ github.event.schedule }}"
            echo "Fired by scheduled cron: $CRON"
            ID=$(printf '%s' "$SCHEDULE_MAP" | python3 -c \
              'import sys,json; m=json.load(sys.stdin); print(m.get(sys.argv[1],""))' "$CRON")
            if [ -z "$ID" ]; then
              echo "No schedule id mapped for cron '$CRON'"; exit 1
            fi
            echo "id=$ID" >> "$GITHUB_OUTPUT"
            echo "-> schedule id: $ID"
          fi
      - name: POST idempotent schedule trigger (wakes autosleep machine)
        env:
          SCHEDULE_TRIGGER_URL: ${{ secrets.SCHEDULE_TRIGGER_URL }}
          SCHEDULE_TRIGGER_TOKEN: ${{ secrets.SCHEDULE_TRIGGER_TOKEN }}
          MANUAL: ${{ github.event.inputs.schedule_id }}
        run: |
          BASE="${SCHEDULE_TRIGGER_URL%/}"
          URL="$BASE/internal/schedules/${{ steps.sched.outputs.id }}/run"
          echo "POST $URL"
          # Scheduled fires are authoritative: a non-2xx must fail the job so a
          # broken clock is visible. Manual dispatches are smoke tests that may
          # legitimately land outside the grace window (425/410); surface the body
          # but don't fail, so ops can trigger anytime to confirm wake+auth.
          if [ -n "$MANUAL" ]; then
            curl -sS --max-time 540 -w "\nHTTP %{http_code}\n" \
              -X POST "$URL" \
              -H "Authorization: Bearer $SCHEDULE_TRIGGER_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{}' || true
          else
            # The request stays open for the whole run — that connection IS the
            # activity lease that keeps the autosleep machine awake.
            curl -sS --fail-with-body --max-time 540 \
              -X POST "$URL" \
              -H "Authorization: Bearer $SCHEDULE_TRIGGER_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{}'
          fi