name: schedule-watchdog

# Tertiary external clock. PRIMARY is cron-job.org (fires at the occurrence);
# SECONDARY is the Cloudflare Worker (`pixivflow-control-plane`, +2 min). This
# watchdog fires at 02:35 UTC and re-triggers BOTH single-daily schedules.
# Idempotent: if either earlier clock admitted the occurrence the slot ledger
# answers already_completed / already_running; if BOTH missed it, this run
# creates the slot. 02:35Z is after the 02:00Z / 02:10Z occurrences and the
# +2 min secondary, before the 90-minute grace window expires.
#
# A red run here is a MISSING SAFETY NET, not a cosmetic failure: while this
# clock is broken the two production clocks are the only replay paths. That is
# exactly how it went unnoticed for a week (2026-09-19..2026-09-26): the
# workflow failed daily, nobody was looking, and a failed scheduled workflow is
# silent by default. So a failure now also opens (or bumps) an issue, and a
# later success closes it — an alert nobody has to remember to check.
on:
  schedule:
    - cron: '35 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # The alert channel. Scoped to this job only: the trigger step needs nothing
  # but the network, and issues are the one write this workflow is allowed.
  issues: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fire schedule trigger
        env:
          SCHEDULE_TRIGGER_TOKEN: ${{ secrets.SCHEDULE_TRIGGER_TOKEN }}
        shell: bash
        run: |
          set -u
          # trigger-schedule.sh deliberately refuses an env/argv token for local
          # use; on a GitHub runner we write its secret into a 600 token file so
          # the same script stays the single dispatch implementation.
          umask 077
          printf '%s' "$SCHEDULE_TRIGGER_TOKEN" > "$RUNNER_TEMP/scheduler-trigger-token"
          export SCHEDULER_TRIGGER_TOKEN_FILE="$RUNNER_TEMP/scheduler-trigger-token"
          # The trigger ORIGIN is deliberately NOT supplied here. It has exactly one
          # statement in this repo — control-plane/wrangler.toml's
          # PIXIVFLOW_TRIGGER_BASE_URL — and trigger-schedule.sh reads it from
          # there. A secret copy of the URL is how this watchdog silently pointed
          # at an always-on but unrelated host, got a healthy /health and 404'd on
          # every real trigger, and stayed red for days without anyone noticing.
          failed=0
          for id in bot1-daily bot2-daily; do
            if ! bash ./scripts/trigger-schedule.sh "$id"; then
              echo "watchdog ${id} failed" >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
          done
          exit "$failed"

      # Alert channel. Runs only on failure, so it can never make a healthy clock
      # look red; a failure here is additive information about an already-red run.
      - name: Open or bump the tertiary-clock issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          title='schedule-watchdog failed (tertiary clock)'
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body=$(printf '%s\n\n%s\n\n%s\n' \
            'The tertiary schedule clock could not replay the daily occurrence.' \
            "Run: ${run_url}" \
            'Until this is green again the two production clocks are the only replay paths. The usual cause is not the executor: check what the run actually reached (the log line `trigger origin` names it), then check the bearer token still matches.' )
          existing=$(gh search issues --repo "$GITHUB_REPOSITORY" --state open \
            --match title "$title" --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

      # Self-healing signal: a green run closes the alert it opened. Housekeeping
      # must never fake a clock failure, hence continue-on-error.
      - name: Close the tertiary-clock issue once green
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          title='schedule-watchdog failed (tertiary clock)'
          existing=$(gh search issues --repo "$GITHUB_REPOSITORY" --state open \
            --match title "$title" --limit 1 --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            echo "no open clock issue; nothing to close"
            exit 0
          fi
          gh issue close "$existing" --repo "$GITHUB_REPOSITORY" \
            --comment 'The tertiary clock replayed the occurrence successfully; closing.'
