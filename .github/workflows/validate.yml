name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate examples and Compose
        run: ./scripts/validate.sh --examples

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build combined runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/combined.Dockerfile
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
