name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shell lint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
      - name: Validate public files, examples and Compose
        run: ./scripts/validate.sh --examples
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Test deploy CLI
        run: go test ./...

  build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build combined runtime
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/combined.Dockerfile
          push: false
          load: false
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build passthrough images
        run: |
          docker build -f docker/telepost.Dockerfile -t telepost-passthrough:test .
          docker build -f docker/pixivflow.Dockerfile -t pixivflow-passthrough:test .
