# 外部闹钟：在 PixivFlow 定时投递前唤醒 auto-stop 的 Fly 机器，并保持它醒着
# 直到投递窗口结束。PixivFlow 的 cron 活在进程里，机器一睡 cron 就死、没人叫醒它；
# 所以用 GitHub Actions 的免费 schedule 当作"外部闹钟"。
#
#   cron: "58 1,9 * * *"  (UTC) = 09:58 / 17:58 CST
#   09:58 唤醒 → 机器 10:00 前就绪 → PixivFlow 10:00/10:10 正常点火；
#   循环 ping 约 30 分钟，覆盖整段投递窗口（投递走 127.0.0.1 环回、不经 proxy，
#   不会重置 auto-stop 计时，必须靠外部 ping 续命）。

name: Wake PixivFlow

on:
  schedule:
    - cron: "58 1,9 * * *"   # UTC = 09:58 / 17:58 CST
  workflow_dispatch:

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    steps:
      - name: Wake and keep awake through the delivery window
        run: |
          # 约 30 分钟，每 60s ping 一次；冷启动 5-15s，--max-time 60 给足余量。
          for i in $(seq 1 30); do
            curl -sf --max-time 60 https://telesubmit-multi-bot.fly.dev/health || true
            sleep 60
          done
          echo "delivery window covered"
