name = "pixivflow-control-plane"
main = "src/index.ts"
compatibility_date = "2025-09-01"
# Control plane only: JSON in, JSON out. Media never passes through the Worker.
workers_dev = true

# A single periodic reconciliation sweep is the clock. Not four one-shot crons:
# a tick that never fires must not lose the day's work, so each sweep recomputes
# which occurrences exist and creates what is missing.
[triggers]
crons = ["*/10 * * * *"]

[[d1_databases]]
binding = "CONTROL_DB"
database_name = "pixivflow-control"
database_id = "1fa00cbc-6dcc-4a89-ba8f-30cf79cc286b"

[vars]
# Dispatch is the only lever that spends the shared Pixiv credential, so both
# switches live here rather than being flipped out of band (production and this file
# must never disagree):
#   DISPATCH_PAUSED = "true"   opens no new attempts. Reconcile / create / expire keep
#                              running, so the ledger stays honest and every withheld
#                              occurrence is visible as a `dispatch_paused` event.
#   EXECUTION_MODE = "shadow"  still dispatches; it only guarantees the runner cannot
#                              publish. A second lock, not a brake.
# Pause instead of raising the watchdog when the account is being throttled: one
# dispatch is 30 minutes of requests against it.
#
# INCIDENT 2026-09-11 (resolved): `pixiv-main` entered a Pixiv rate-limit penalty
# while the legacy Fly plane (`telesubmit-multi-bot`, stopped 04:34Z) refreshed the
# same credential from a second process, so every live dispatch from 02:00Z died on
# the batch's own 1800000ms watchdog with `download_failed` (5/5 attempts across both
# bots), while the same work finished in ~3 minutes at 2026-09-10T21:19Z. Dispatch
# was paused at 05:21Z and lifted once the account had ~3 hours of cooldown with no
# second plane running: one credential, one active execution.
EXECUTION_MODE = "live"
RECONCILIATION_LOOKBACK_HOURS = "24"
# This Worker's public base URL (a cron trigger has no request URL, so the runner
# would otherwise have nowhere to report back).
CONTROL_PLANE_URL = "https://pixivflow-control-plane.redtidev1918.workers.dev"
GITHUB_REPO = "redtidev1918/pixivflow-telepost-deploy"
GITHUB_WORKFLOW = "pixivflow-batch.yml"
GITHUB_REF = "main"
# Which PixivFlow ref runners execute. Pin a released tag once PixivFlow ships
# the batch command; until then the feature branch under test.
PIXIVFLOW_REF = "master"

# Secrets (set with `wrangler secret put`, never committed):
#   GITHUB_DISPATCH_TOKEN  TEMPORARY MIGRATION AUTH (replace with a GitHub App)
#   CALLBACK_SECRET        bearer the GitHub job uses to report claim/result
#   TELEGRAM_WEBHOOK_SECRET
