# The clock. Cron expression in, authenticated trigger request out.
#
# There is deliberately no [[d1_databases]] binding, no queue, no KV and no
# service binding here. Anything that needs to remember something about a run
# belongs to PixivFlow's slot ledger.
#
# Secrets (never in this file):
#   wrangler secret put SCHEDULER_TRIGGER_TOKEN   # bearer for the trigger endpoint

name = "pixivflow-control-plane"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true

[observability]
enabled = true

# Expressions are UTC. See src/cron-map.ts: the same strings are the keys of the
# schedule map, and each one is the Asia/Shanghai schedule time minus 8 hours.
# `deployment-contract.test.ts` fails if the two lists drift apart.
[triggers]
crons = ["0 2,10 * * *", "10 2,10 * * *"]

[vars]
# Deployment glue: where PixivFlow's authenticated trigger listens. Not a secret.
PIXIVFLOW_TRIGGER_BASE_URL = "https://pixivflow-scheduler.fly.dev"
